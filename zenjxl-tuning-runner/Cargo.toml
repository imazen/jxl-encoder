[package]
name = "zenjxl-tuning-runner"
description = "W44-212 sweep worker: encode one (image, effort, distance, strategy, params) cell with the jxl-encoder, score on GPU via zen-metrics, emit a Parquet row for MLP training"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only OR LicenseRef-Imazen-Commercial"
repository = "https://github.com/imazen/jxl-encoder"
homepage = "https://github.com/imazen/jxl-encoder"
authors = ["Lilith River"]
rust-version = "1.89"
publish = false

[lints]
workspace = true

[[bin]]
name = "zenjxl-tuning-runner"
path = "src/main.rs"

[lib]
name = "zenjxl_tuning_runner"
path = "src/lib.rs"

[features]
# Default = no GPU metrics; CPU encode + decode + Parquet emit, GPU
# metric columns null'd with `*_backend = "skip"`. Useful for local
# end-to-end smoke testing without a GPU.
default = []

# Shell out to `zen-metrics score --metric butter-norm3-gpu` / `ssim2-gpu`
# / `cvvdp-gpu` for GPU scoring. Requires the `zen-metrics` binary on
# PATH (provided by the `zenmetrics` repo with `--features gpu-cuda
# gpu-butteraugli gpu-ssim2 gpu-cvvdp`).
gpu-metrics-cli = []

# CPU fallback metrics (butteraugli + ssim2 + dssim). Used when the
# GPU CLI is unavailable; rows mark `*_backend = "cpu"`.
cpu-metrics = ["dep:butteraugli", "dep:fast-ssim2", "dep:imgref", "dep:rgb", "dep:yuvxyb"]

[dependencies]
# Encoder under test. Pulls the `tuning-override` feature so we can
# install per-cell `RuntimeTuning` overrides before encoding. Note:
# as of W44-211 the override layer is scaffolded but production code
# paths still read consts directly — installing an override has no
# runtime effect until W44-213+ wires consumers.
#
# The package name on disk is `jxl-encoder` (hyphen); the library
# crate name in Rust source is `jxl_encoder` (underscore). We rename
# back to `jxl_encoder` so `use jxl_encoder::...` works in this
# crate's source.
jxl_encoder = { package = "jxl-encoder", path = "../jxl-encoder", features = ["std", "butteraugli-loop", "parallel", "tuning-override", "__pre_quantized"] }

# Roundtrip decode (primary per project rule).
jxl = "0.4.0"
jxl_transforms = "0.4.0"

# Source image read (PNG) + sha256.
image = { version = "0.25", default-features = false, features = ["png"] }
sha2 = "0.10"
hex = "0.4"

# CLI + JSON cell spec.
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# RuntimeTuning postcard payload encode/decode for the params_blob col.
postcard = { version = "1.0", features = ["alloc"] }

# Parquet emit (polars is heavy; arrow-rs minimal feature set is enough).
arrow-array = "53"
arrow-schema = "53"
parquet = { version = "53", default-features = false, features = ["arrow", "zstd"] }

# Optional CPU metrics (only pulled in with --features cpu-metrics).
# Pinned versions match what `jxl-encoder/Cargo.toml` dev-deps use so
# `cargo update` doesn't have to resolve two trees.
# W44-PHASE4-M1: bumped fast-ssim2 0.7.1 → 0.8.0 (current latest)
# alongside the call-site API change from `compute_frame` to
# `compute_ssimulacra2` (the 0.7 → 0.8 deprecation; the original
# call-site never compiled against 0.8.0). `yuvxyb` dropped because
# `compute_ssimulacra2` accepts `ImgRef<[u8; 3]>` directly without
# the explicit RGB conversion the prior code did.
butteraugli = { version = "0.9.2", optional = true }
fast-ssim2 = { version = "0.8.0", features = ["imgref"], optional = true }
imgref = { version = "1.10", optional = true }
rgb = { version = "0.8", optional = true }
yuvxyb = { version = "0.5", optional = true }

# CPU-rusage timing (unix-only syscall; non-unix gets a zero-reading
# stub in src/rusage.rs so the workspace checks everywhere).
[target.'cfg(unix)'.dependencies]
libc = "0.2.180"

[dev-dependencies]
tempfile = "3"
# Postcard for the round-trip blob tests in params.rs.
postcard = { version = "1.0", features = ["alloc"] }
