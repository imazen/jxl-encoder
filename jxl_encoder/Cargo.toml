[package]
name = "jxl-encoder"
description = "JPEG XL encoder in pure Rust"
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
keywords = ["jpeg-xl", "encoder", "image"]
categories = ["multimedia::images", "multimedia::encoding"]

[dependencies]
enough = "0.3.1"
whereat = "0.1.3"
bytemuck = { version = "1.25", features = ["derive"] }
thiserror = "2.0"
byteorder = "1.4"
jxl_simd = { package = "jxl-encoder-simd", version = "0.1.0", path = "../jxl_simd" }
archmage = "0.5"
num-derive = "0.4"
num-traits = "0.2"
zenjpeg = { version = "0.6.1", path = "../../zenjpeg/zenjpeg", features = ["decoder"], optional = true }
brotli = { version = "8.0", optional = true }
# Optional dependencies for butteraugli-loop and rate-control features
jxl-oxide = { version = "0.12.5", path = "../../jxl-efforts/jxl-oxide/crates/jxl-oxide", optional = true }
butteraugli = { version = "0.4.0", path = "../../butteraugli-opt/butteraugli", optional = true }
imgref = { version = "1.10", optional = true }
rgb = { version = "0.8", optional = true }

[features]
std = []
trace-bitstream = []
# Verbose debug output for token encoding (DC, AC, entropy codes)
debug-tokens = []
# Debug DC extraction for DCT16x16/32x32
debug-dc = []
# Print AC strategy selection histogram
debug-ac-strategy = []
# Guard flag — no behavioral effect (multi-group works correctly)
safe-mode = []
# Iterative rate control for improved distance targeting.
# Requires jxl-oxide for decoding and butteraugli for quality measurement.
rate-control = ["dep:jxl-oxide", "dep:butteraugli", "dep:imgref", "dep:rgb"]
# Butteraugli quantization loop: iteratively refines quant field using butteraugli distmap.
butteraugli-loop = ["dep:butteraugli", "dep:imgref", "dep:rgb"]
jpeg-reencoding = ["dep:zenjpeg", "dep:brotli"]
default = ["std", "safe-mode", "butteraugli-loop"]

[dev-dependencies]
rand = "0.9"
rand_xorshift = "0.4"
image = "0.25"
# jxl-rs (github.com/lilith/jxl-rs) is the PRIMARY decoder for roundtrip tests
jxl = { version = "0.3.0", path = "../../jxl-rs/jxl" }
jxl_transforms = { version = "0.3.0", path = "../../jxl-rs/jxl_transforms" }
# jxl-oxide is secondary — always test jxl-rs first
jxl-oxide = { version = "0.12.5", path = "../../jxl-efforts/jxl-oxide/crates/jxl-oxide" }
jxl-jbr = { version = "0.2.1", path = "../../jxl-efforts/jxl-oxide/crates/jxl-jbr" }
# SSIMULACRA2 for perceptual quality metrics
fast-ssim2 = { version = "0.6.5", path = "../../fast-ssim2/ssimulacra2", features = ["imgref"] }
yuvxyb = "0.4.1"
# Butteraugli perceptual quality metric
butteraugli = { version = "0.4.0", path = "../../butteraugli-opt/butteraugli" }
imgref = "1.10"
rgb = "0.8"
walkdir = "2.5"

[lints]
workspace = true
