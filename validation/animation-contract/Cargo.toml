[package]
name = "jxl-animation-contract-validation"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
jxl-encoder = { path = "../../jxl-encoder", default-features = false, features = ["std", "convenience"] }
zensim-decoder = { package = "zenjxl-decoder", version = "0.4.0" }
zenpixels-convert = { version = ">=0.2.16, <0.4.0", features = ["icc-db"] }
jxl-oxide = "0.12.6"
enough = "0.4.3"

[[test]]
name = "animation_contract"
path = "../../jxl-encoder/tests/animation_contract.rs"

