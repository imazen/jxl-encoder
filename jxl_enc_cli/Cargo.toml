[package]
name = "jxl_enc_cli"
description = "Command-line JPEG XL encoder"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "cjxl-rs"
path = "src/main.rs"

[features]
default = []
debug-tokens = ["jxl_enc/debug-tokens"]
debug-ac-strategy = ["jxl_enc/debug-ac-strategy"]
# Enable iterative rate control for improved distance targeting
rate-control = ["jxl_enc/rate-control"]
# Enable butteraugli quantization loop for per-block quality refinement
butteraugli-loop = ["jxl_enc/butteraugli-loop"]

[dependencies]
jxl_enc = { path = "../jxl_enc", version = "0.1.0" }
clap = { version = "4", features = ["derive"] }
png = "0.17"

[lints]
workspace = true
