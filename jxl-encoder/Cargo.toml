[[example]]
name = "e10_e11_paired_ab"
path = "examples/e10_e11_paired_ab.rs"
required-features = ["butteraugli-loop"]

# RFC#45 chunk 2: e10/e11 multi-seed lossless tree-learning A/B/C bench.
# No butteraugli-loop needed (lossless path).
[[example]]
name = "e10_e11_multiseed_ab"
path = "examples/e10_e11_multiseed_ab.rs"

# RFC#45 chunk 3 (lossless): broader seed variance (split_threshold jitter,
# property-order rotation, stride perturbation). 5-image default corpus.
[[example]]
name = "e10_e11_multiseed_chunk3_ab"
path = "examples/e10_e11_multiseed_chunk3_ab.rs"

# RFC#45 chunk 4 (lossless): two extra variance dimensions on top of chunk 3
# — sample-fraction jitter (tree_sample_fraction ∈ {0.40, 0.60, 0.70}) and
# predictor-evaluation-order shuffle (4 permutations of CANDIDATE_PREDICTORS).
# 5-image default corpus.
[[example]]
name = "e10_e11_multiseed_chunk4_ab"
path = "examples/e10_e11_multiseed_chunk4_ab.rs"

# RFC#45 chunk 5 (lossless): seed-slot split + budget expansion at e11.
# tree_learn_seeds_for(11) was 4 → now 8. Seeds 0..=3 are chunk-3-only
# (chunk-4 helpers no-op). Seeds 4..=7 layer the chunk-4 dimensions
# (sample-fraction override + predictor-order shuffle) on top of chunk-3
# perturbations. Honest A/B vs chunk 4 (ef5c1d11).
[[example]]
name = "e10_e11_multiseed_chunk5_ab"
path = "examples/e10_e11_multiseed_chunk5_ab.rs"

# RFC#45 chunk 6 (lossless): seed budget 8 → 16 at e11 + 2 new variance
# dimensions (max_property_values + properties.len() truncation). Seeds
# 0..=3 chunk-3-only, 4..=7 chunk-4 dimensions, 8..=11 chunk-6 bucket
# override, 12..=15 chunk-6 properties truncation. Honest A/B vs chunk
# 5 (2b2ce912).
[[example]]
name = "e10_e11_multiseed_chunk6_ab"
path = "examples/e10_e11_multiseed_chunk6_ab.rs"

# RFC#45 chunk 3 (lossy): multi-seed butteraugli sweep isolation A/B.
# Toggles `lossy_search_seeds` to isolate the chunk-3 contribution
