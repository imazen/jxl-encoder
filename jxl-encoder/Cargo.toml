# fires on; default Reference mode is unchanged).
[[example]]
name = "patches_gate_experimental_ab"
path = "examples/patches_gate_experimental_ab.rs"

# RFC#45 chunks 4-7 lossless backport — fits the per-pixel savings
# constant for `PatchesData::is_cost_effective_lossless` from paired
# patches-on/off trial encodes in lossless mode. Lossless has no
# `distance` axis so the model shape is `pixels * C` (no `1/sqrt(d)`).
[[example]]
name = "patches_lossless_calibrate"
path = "examples/patches_lossless_calibrate.rs"
required-features = ["__internals"]

# RFC#45 chunks 4-7 lossless backport — A/B harness verifying the
