[package]
name = "jxl-encoder"
description = "JPEG XL encoder in pure Rust"
readme = "README.md"
documentation = "https://docs.rs/jxl-encoder"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
keywords = ["jpeg-xl", "encoder", "image"]
categories = ["multimedia::images", "multimedia::encoding"]
include = ["/src/**", "/examples/*.rs", "/tests/*.rs", "/tests/*.txt", "/README.md", "/LICENSE*"]
# Disable example auto-discovery so internal-only tools (e.g. picker oracle
# calibration harnesses with sibling-repo path deps) don't break out-of-tree
# CI builds. Examples must be listed explicitly via [[example]] below.
autoexamples = false

[dependencies]
enough = "0.4.3"
once_cell = { version = "1.21", default-features = false, features = ["race", "alloc"] }
hashbrown = { version = "0.16", default-features = false, features = ["default-hasher"] }
whereat = { version = "0.1.5"}
bytemuck = { version = "1.25", features = ["derive"] }
thiserror = { version = "2.0", default-features = false }
jxl_simd = { package = "jxl-encoder-simd", version = "0.3.0", path = "../jxl-encoder-simd", default-features = false }
archmage = { version = "0.9.15", default-features = false, features = ["macros"] }
rayon = { version = "1.10", optional = true }
zenjpeg = { version = "0.8.4", default-features = false, features = ["decoder"], optional = true }
brotli = { version = "8.0", default-features = false, features = ["std"], optional = true }
# Issue #47 chunk 3: SIMD RGB↔YCbCr / 4:4:4 / 4:2:0 / 4:2:2 conversion +
# Sharp YUV for chroma subsampling. Production-quality, archmage-based
# (matches our SIMD dispatch convention). Used by the chroma-subsampling
# helpers in `vardct::chroma_subsampling`. Gated `chroma-subsampling`
# so callers that don't ship YCbCr paths don't pull the extra binary.
zenyuv = { version = "0.1.3", default-features = false, optional = true }
# Optional dependencies for butteraugli-loop and rate-control features
jxl-oxide = { version = "0.12.5", default-features = false, optional = true }
butteraugli = { version = "0.9", optional = true }
imgref = { version = "1.12", optional = true }
rgb = { version = "0.8", optional = true }
fast-ssim2 = { version = "0.7.1", features = ["imgref"], optional = true }
zensim = { version = "0.2", optional = true }
# Ultra HDR gain map math + ISO 21496-1 serializer.
# `default-features = false` skips the `tonemap` feature (which transitively
# pulls zentone); we only need the gain-map compute path + the ISO 21496-1
# serializer (re-exported from zencodec). `std` is enabled for std-only
# error types and allocation paths. Mandatory deps still include zenpixels
# + zencodec (already in the dep tree of ultrahdr-core 0.5+).
ultrahdr-core = { version = "0.5.0", default-features = false, features = ["std"], optional = true }

[features]
std = ["thiserror/std", "archmage/std", "jxl_simd/std"]
# Ultra HDR gain map encoding: typed `GainMapBundle` serializer that matches
# libjxl `JxlGainMapBundle` byte-for-byte (jhgm box payload), plus an
# `HdrFromSdrRequest` end-to-end API that takes an SDR + HDR pair, computes
# the gain map via `ultrahdr_core::gainmap::compute_gainmap`, encodes the SDR
# base image as a JXL codestream, and muxes the gain map into a single JXL
# container so capable decoders reconstruct the HDR while standard decoders
# display the SDR. Requires `std`. Issue #46 (A3 chunks 3+4).
hdr-gainmap = ["std", "dep:ultrahdr-core"]
trace-bitstream = []
# Verbose debug output for token encoding (DC, AC, entropy codes)
debug-tokens = []
# W44-27: per-block AdjustQuantBlockAC firing-rate diagnostic.
# Counts per-heuristic firings (A/B/C/D/E/F) per (strategy, channel) and
# emits a TSV to `$JXL_AQBA_DIAG_TSV` env var when set, else stderr summary.
investigate-adjust-quant-block-ac = []
# Debug DC extraction for DCT16x16/32x32
debug-dc = []
# Print AC strategy selection histogram
debug-ac-strategy = []
# Spatial decision logging — writes sidecar CSV with per-rect decisions
debug-rect = []
# Iterative rate control for improved distance targeting.
# Requires jxl-oxide for decoding and butteraugli for quality measurement.
rate-control = ["dep:jxl-oxide", "dep:butteraugli", "dep:imgref", "dep:rgb"]
# Butteraugli quantization loop: iteratively refines quant field using butteraugli distmap.
butteraugli-loop = ["dep:butteraugli", "dep:imgref", "dep:rgb"]
ssim2-loop = ["dep:fast-ssim2", "dep:imgref"]
zensim-loop = ["dep:zensim"]
# Convenience encode functions that accept imgref::ImgRef with typed pixel formats.
convenience = ["dep:imgref", "dep:rgb"]
jpeg-reencoding = ["dep:zenjpeg", "dep:brotli"]
# Brotli-compressed metadata boxes (`brob`) for EXIF/XMP. Wraps each
# metadata blob in a brob box that decompresses to the original
# Exif/xml/jumb box, typically 2-4× smaller for XML / binary metadata.
# libjxl default-on (`jpeg_compress_boxes = true`).
brotli-metadata = ["dep:brotli"]
parallel = ["std", "dep:rayon"]
# Chroma subsampling (4:2:0 / 4:2:2 / 4:4:0) helpers — RGB→YCbCr conversion
# and Sharp YUV chroma downsampling via the zenyuv crate. Issue #47 chunk 3.
# API surface (`ChromaSubsampling` enum + `LossyConfig::with_chroma_subsampling`)
# is always compiled; this feature only adds the conversion helpers in
# `vardct::chroma_subsampling` and the zenyuv dep. Non-`Full444` modes
# still return `EncodeError::InvalidConfig` until chunk 4 wires the
# helpers through the VarDCT encode pipeline (per-channel block grids,
# YCbCr colour pipeline switch — multi-week work).
chroma-subsampling = ["dep:zenyuv"]
# Parallel tree learning for lossless modular path.
# After dedup, splits the sample range at the root partition point and builds
# the left+right subtrees in parallel via `rayon::join` using owned per-side
# clones of the TreeSamples + PreQuantizedProps. Recursion forks each subtree
# further up to `max_parallel_depth=4` levels (=> up to 16 leaf tasks).
# Bitstream-equivalent: tree topology + node contents are determined by the
# samples, not by build order; serialization is BFS-from-root so internal
# node-vec indexing is invisible to bytes. Hash-lock-verified on the 36-case
# `tests/hash_lock_features.rs` corpus AND byte-identical on the 3 standard
# real-photo profile images (0.26 / 1.05 / 4.19 MP). Requires `parallel`.
# Measured speedup: 1.27-1.51× on real photos at >= 4 threads (Amdahl ceiling
# ≈1.4× because compute_best_tree is ~59% of e7 wall-clock; tree-internal
# speedup is ~1.67× — see benchmarks/rayon_tree_learning_scaling_2026-05-16).
# Default-off because it requires the rayon dependency; opt-in for callers
# that already enable `parallel`.
parallel-tree-learning = ["parallel"]
# Picker training / sweep escape hatch: exposes the segmented
# LossyInternalParams / LosslessInternalParams structs and the
# LossyConfig::with_internal_params / LosslessConfig::with_internal_params
# setters. The split mirrors the encoder's mode boundary so the type system
# enforces mode-correctness (lossy-only knobs cannot be passed to the
# lossless setter, and vice versa). Not stable; field sets may grow
# additively between minor versions.
__expert = []
# Re-exports private vardct internals (epf_step0_strip, adjust_quant_block_ac,
# compute_scaled_constants, ytox_ratio, ytob_ratio, INV_DC_QUANT) under a
# `pub mod __internals` for downstream parity testing (notably from
# jxl-encoder-gpu's forks::* tests). Off by default; not part of the
# stable API surface — items here may move or change at any time.
__internals = []
# Pre-quantized AC entry point: exposes EncoderPrecomputed::from_parts
# constructor and lifts the rate-control gate on
# VarDctEncoder::encode_from_precomputed, transform_and_quantize, and
# encode_two_pass. Lets jxl-encoder-gpu (or any pre-quantized caller)
# hand the encoder a fully-prepared XYB plane + AC strategy + CfL map +
# quant field and skip the encoder's own XYB / CfL / masking / strat-
# search / butteraugli refinement work, going straight to bitstream
# emit. Off by default; not stable; mirrors `__internals` shape — items
# may move or change at any time.
__pre_quantized = []
# Re-exports the chunk-1 SplitTreeSamples primitive (modular::tree_learn_split)
# for the in-crate microbench (benches/tree_learn_split_read_pattern.rs).
# Off by default; not stable; pure re-export with no behavior change. Issue #40.
__bench_internals = []
# Debug hook for capturing the butteraugli loop's INTERNAL reconstruction
# (the planar linear RGB the loop measures butteraugli against, after the
# final SetQuantField → transform → quantize → reconstruct → gab → EPF
# → patches → splines → xyb_to_linear pipeline at iter == iters). Backed
# by a global Mutex<Option<...>>. The drift-investigation Layer-1 test
# enables this feature to compare the buttloop's internal recon against
# what jxl-rs decodes from the SHIPPED bitstream — divergence > a tight
# threshold pinpoints the quality-targeting drift identified in
# memory/quality_drift_investigation_2026-05-15.md. Off by default; not
# stable; pure debug instrumentation. Requires `butteraugli-loop`.
__internal_recon_hook = ["butteraugli-loop"]
# Corpus-dependent tests. When enabled, tests under
# `#[cfg_attr(not(feature = "corpus-tests"), ignore = "...")]` run; otherwise
# they're marked as #[ignore] so the skip decision is visible at the test
# attribute level (caller-controlled), not buried inside the test body.
# CI must enable this feature explicitly when corpus is staged.
corpus-tests = []
# Per-phase wall-clock instrumentation for diagnosing the lossless e3->e7
# encode-time cliff (issue #23). Records sample-gather, tree-learn, residual-
# collect, histogram-cluster, and ANS/LZ77 emit times to a thread-local
# accumulator that the lossless_cliff_profile example reads back. Zero cost
# when feature is disabled. Only used by maintainer profiling; not stable.
profile-phases = ["std"]
default = ["std", "butteraugli-loop"]

[dev-dependencies]
image = "0.25"
# jxl-rs (github.com/lilith/jxl-rs) is the PRIMARY decoder for roundtrip tests
jxl = "0.4.0"
jxl_transforms = "0.4.0"
# jxl-oxide is secondary — always test jxl-rs first
jxl-oxide = "0.12.5"
jxl-jbr = "0.2.1"
# SSIMULACRA2 for perceptual quality metrics
fast-ssim2 = { version = "0.7.1", features = ["imgref"] }
yuvxyb = "0.5.0"
# Butteraugli perceptual quality metric
butteraugli = "0.9"
imgref = "1.12"
rgb = "0.8"
walkdir = "2.5"
sha2 = "0.11.0"
# zenjpeg comparator for the lossy low-effort cross-codec baseline (W38).
# `trellis` enables the HybridProgressive / HybridMaxCompression presets;
# `parallel` enables rayon-fanout for fair wall-clock comparison.
# Workspace `[patch.crates-io]` redirects zenjpeg to the local sibling path
# (see workspace Cargo.toml line 62); use the registry coordinate here so
# both refer to the same canonical source.
zenjpeg = { version = "0.8.4", default-features = false, features = ["decoder", "trellis", "parallel"] }
# Microbench harness for the chunk-1 SplitTreeSamples primitive (issue #40).
# zenbench is the workspace-standard benchmarking tool — interleaved sampling
# and paired statistics give cleaner signal than criterion's isolated rounds.
zenbench = "0.1.8"
# archmage is already a regular dep (`default-features = false, features = ["macros"]`);
# the test suite needs `std` for `archmage::testing::for_each_token_permutation`
# (used by `tests/nonfinite_xyb_repro.rs` to exercise scalar / SSE / AVX2 / etc.
# fallback paths on the trigger fixtures).
archmage = { version = "0.9.15", default-features = false, features = ["macros", "std"] }

# codec-corpus uses fd-lock which doesn't compile on WASM
[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
codec-corpus = "1.0.1"
rayon = "1.10"
# Restored 2026-05-18 (W44-16) — required by examples/cjxl_parity_ledger.rs
# for inline TOC parsing of cjxl reference bitstreams. These were dropped
# in the W43-2 chunk-7 mass-deletion (ac903e02) but the example survived
# the deletion-restore cycle and still needs them.
jxl-frame = "0.13.3"
jxl-bitstream = "1.1.0"
jxl-image = "0.13.0"
jxl-color = "0.11.0"
jxl-oxide-common = "1.0.0"
# Deterministic RNG for picker oracle scalar sampling.
fastrand = "2.4.1"
# NOTE on `zenanalyze` (sibling path dep) — required by
# `examples/smart_fanout_sweep.rs` (chunk 1 of the smart-fanout investigation,
# memory/zenanalyze_tree_size_correlation_2026-05-17.md),
# `examples/content_class_dispatch_ab.rs` (RFC #45 pick #4 chunk 1, this dispatch),
# and the picker-oracle calibration harnesses. Out of CI; re-add locally with:
#   zenanalyze = { path = "../../zenanalyze", features = ["experimental"] }
# alongside a [[example]] block for the sweep, then revert before pushing.

