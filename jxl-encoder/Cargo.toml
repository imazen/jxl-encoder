# {0.5, 1.0, 2.0, 5.0} with both jxl-encoder and cjxl, decodes via jxl-rs,
# and reports byte size + alpha MAE per (image, distance). See
# /mnt/v/output/jxl-encoder/alpha-distance-audit-2026-05-17/ for sweep output.
[[example]]
name = "alpha_distance_audit"
path = "examples/alpha_distance_audit.rs"

# RFC#45 chunk 4 calibration harness — fits the per-pixel savings
# constant in `PatchesData::is_cost_effective` from paired
# patches-on/off trial encodes. Uses the `__internals`-gated
# `LastPatchesStats` thread-local snapshot.
[[example]]
name = "patches_savings_calibrate"
path = "examples/patches_savings_calibrate.rs"
required-features = ["__internals"]

# RFC#45 chunk 4 verification — shows that the recalibrated
# `is_cost_effective` constant re-activates patches admission on
