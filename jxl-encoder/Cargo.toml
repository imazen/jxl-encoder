path = "examples/patches_lossy_gate_expanded_corpus.rs"
required-features = ["__internals"]

# RFC#45 lossless patches gate recalibration on expanded corpus.
[[example]]
name = "patches_lossless_gate_expanded_corpus"
path = "examples/patches_lossless_gate_expanded_corpus.rs"
required-features = ["__internals"]

[[example]]
name = "bench_lossy_palette"
