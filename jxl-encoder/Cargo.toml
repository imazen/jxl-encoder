# `tier2_expand_5knob` mirror in
# `scripts/zenjxl-tuning-sweep/build_w44_229_chunks.py` reproduces
# `Tier2Knobs::expand_to_runtime_tuning` byte-for-byte. Prints CSV
# with the 24-byte LE postcard-equivalent blob hex for 4 samples.
# Run the Python mirror separately and diff — failing parity here
# means the W44-229 sweep would emit blobs whose actual encoder
# behaviour differs from the Python labels (analysis would be wrong).
[[example]]
name = "w44_229_parity_check"
path = "examples/w44_229_parity_check.rs"
required-features = ["tuning-override"]

# W44-PHASE4-S2-validate: production-cell verification of the
# W44-PHASE4-S2-refit Tier2Knobs lookup. Encodes ONE
# (image, effort, distance, mode, class) tuple per process invocation
# and emits one TSV row. Single-process-per-cell is required to dodge
# the `runtime::install_or_check_idempotent` OnceLock (each stratum
# expands to a different RuntimeTuning; a single process can install
# only one). Mode A = `Tier2Knobs::default()` (production default,
# byte-identical to no-knobs path). Mode B =
# `Tier2Knobs::auto_for_distance(class, distance)` (the on-disk
# W44-PHASE4-S2 lookup).
[[example]]
name = "w44_phase4_s2_validate"
path = "examples/w44_phase4_s2_validate.rs"
required-features = ["__expert", "tuning-override", "parallel", "butteraugli-loop", "ssim2-loop"]

