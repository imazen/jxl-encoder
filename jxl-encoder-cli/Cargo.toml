[package]
name = "jxl-encoder-cli"
description = "Command-line JPEG XL encoder"
readme = "README.md"
documentation = "https://docs.rs/jxl-encoder-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
keywords = ["jpeg-xl", "encoder", "cli"]
categories = ["command-line-utilities", "multimedia::images"]
include = ["/src/**", "/README.md", "/LICENSE*"]

[[bin]]
name = "cjxl-rs"
path = "src/main.rs"

[features]
profile-phases = ["jxl_encoder/profile-phases"]
default = ["jxl_encoder/std", "jxl_encoder/learned-admission", "butteraugli-loop", "parallel", "parallel-tree-learning"]
debug-tokens = ["jxl_encoder/debug-tokens"]
# W44-27 diagnostic: per-block AdjustQuantBlockAC firing-rate counters
investigate-adjust-quant-block-ac = ["jxl_encoder/investigate-adjust-quant-block-ac"]
debug-ac-strategy = ["jxl_encoder/debug-ac-strategy"]
debug-rect = ["jxl_encoder/debug-rect"]
# Enable iterative rate control for improved distance targeting
rate-control = ["jxl_encoder/rate-control"]
# Enable butteraugli quantization loop for per-block quality refinement
butteraugli-loop = ["jxl_encoder/butteraugli-loop"]
# Enable SSIM2 quantization loop (alternative to butteraugli)
ssim2-loop = ["jxl_encoder/ssim2-loop"]
# Enable zensim quantization loop (alternative to butteraugli)
zensim-loop = ["jxl_encoder/zensim-loop"]
# Enable parallel group encoding with rayon
parallel = ["jxl_encoder/parallel"]
# Enable rayon-parallel tree learning in lossless modular path.
# After dedup, the root split is parallelized via rayon::join with owned
# per-side TreeSamples + PreQuantizedProps clones; recursive subtree builds
# may fork further (depth-capped) until subtree size or budget exhaustion.
# Default-off pending hash-lock verification on the broader test corpus.
parallel-tree-learning = ["jxl_encoder/parallel-tree-learning", "parallel"]
# Passthrough: compile-in the diagnostic dump env hooks (see jxl-encoder).
__env_var_diagnostics = ["jxl_encoder/__env_var_diagnostics"]
# Enable JPEG → JXL lossless transcoding. When this feature is on, the
# CLI auto-detects `.jpg` / `.jpeg` input (or accepts `--lossless-jpeg`
# to force the path) and routes through
# `LosslessConfig::encode_jpeg_transcode`. Output is a JXL container
# with the JBRD reconstruction box, so
# `djxl out.jxl out.jpg --reconstruct_jpeg` reproduces the original
# JPEG byte-for-byte. Pulls in zenjpeg + brotli through jxl-encoder.
jpeg-reencoding = ["jxl_encoder/jpeg-reencoding"]
# Enable Brotli-compressed (`brob`) metadata container boxes for
# EXIF / XMP / JUMBF. Passes the CLI's `--brotli-effort` knob through
# to `EncodeRequest::with_brotli_metadata`. When this feature is off
# the CLI still accepts the flag (so scripts stay portable) but the
# value is ignored — plain `Exif` / `xml ` / `jumb` boxes are written.
brotli-metadata = ["jxl_encoder/brotli-metadata"]

[dependencies]
jxl_encoder = { package = "jxl-encoder", path = "../jxl-encoder", version = "0.3.2", default-features = false }
clap = { version = "4", features = ["derive"] }
png = "0.18"

[dev-dependencies]
# Used by integration tests to load + crop the real-photo fixture
# (jxl-encoder/tests/images/frymire.png) into a small region the CLI
# can encode quickly.
image = { version = "0.25", default-features = false, features = ["png"] }

[lints]
workspace = true
