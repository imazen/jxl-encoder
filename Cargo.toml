[profile.release]
debug = true

[profile.bench]
debug = true

[profile.test]
opt-level = 3

[profile.dev]
opt-level = 2

[workspace]
members = [
    "jxl-encoder",
    "jxl-encoder-cli",
    "jxl-encoder-macros",
    "jxl-encoder-simd",
    # W44-212: tuning-sweep worker binary. Builds independently with
    # `cargo build -p zenjxl-tuning-runner --release`. Pulled into the
    # workspace member list so `cargo check --workspace` covers it; the
    # binary itself stays opt-in for fleet builds (Dockerfile uses
    # `cargo build -p zenjxl-tuning-runner --release`).
    "zenjxl-tuning-runner",
]
# `apidoc/` is the CI-free public-API snapshot runner: excluded so plain
# `cargo test` and every CI job (incl. --all-features) never compile its
# dependency tree or run rustdoc. Regenerate via `just api-doc`.
exclude = ["apidoc"]
resolver = "2"

[workspace.lints.clippy]
missing_safety_doc = "deny"
undocumented_unsafe_blocks = "deny"
# We port many constants verbatim from libjxl C++ source where they
# are written at double precision. Rust f32 literals get truncated at
# parse time so the runtime value is identical to a "shortened"
# representation, but preserving the source-heritage digit count
# helps audits and parity checks. 145+ such constants in this crate.
excessive_precision = "allow"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.package]
version = "0.4.0"
edition = "2024"
license = "AGPL-3.0-only OR LicenseRef-Imazen-Commercial"
repository = "https://github.com/imazen/jxl-encoder"
homepage = "https://github.com/imazen/jxl-encoder"
authors = ["Lilith River"]
rust-version = "1.93"

# Use the imazen/jxl-oxide fork: upstream 0.12.6 plus the fd4e2c3 empty-section fix.
# The fork carries a patch that lets jxl-oxide accept multi-group VarDCT/patches
# bitstreams whose modular global section is empty — the same bitstreams djxl
# and jxl-rs already accept.
[patch.crates-io]
jxl-oxide = { git = "https://github.com/imazen/jxl-oxide.git", rev = "08395e61c1789f70bd1890fb29682e5aca274efa" }
jxl-color = { git = "https://github.com/imazen/jxl-oxide.git", rev = "08395e61c1789f70bd1890fb29682e5aca274efa" }
jxl-image = { git = "https://github.com/imazen/jxl-oxide.git", rev = "08395e61c1789f70bd1890fb29682e5aca274efa" }
jxl-bitstream = { git = "https://github.com/imazen/jxl-oxide.git", rev = "08395e61c1789f70bd1890fb29682e5aca274efa" }
jxl-coding = { git = "https://github.com/imazen/jxl-oxide.git", rev = "08395e61c1789f70bd1890fb29682e5aca274efa" }
jxl-frame = { git = "https://github.com/imazen/jxl-oxide.git", rev = "08395e61c1789f70bd1890fb29682e5aca274efa" }
jxl-grid = { git = "https://github.com/imazen/jxl-oxide.git", rev = "08395e61c1789f70bd1890fb29682e5aca274efa" }
jxl-modular = { git = "https://github.com/imazen/jxl-oxide.git", rev = "08395e61c1789f70bd1890fb29682e5aca274efa" }
jxl-render = { git = "https://github.com/imazen/jxl-oxide.git", rev = "08395e61c1789f70bd1890fb29682e5aca274efa" }
jxl-vardct = { git = "https://github.com/imazen/jxl-oxide.git", rev = "08395e61c1789f70bd1890fb29682e5aca274efa" }
jxl-threadpool = { git = "https://github.com/imazen/jxl-oxide.git", rev = "08395e61c1789f70bd1890fb29682e5aca274efa" }
jxl-jbr = { git = "https://github.com/imazen/jxl-oxide.git", rev = "08395e61c1789f70bd1890fb29682e5aca274efa" }
jxl-oxide-common = { git = "https://github.com/imazen/jxl-oxide.git", rev = "08395e61c1789f70bd1890fb29682e5aca274efa" }
# crates.io zenjpeg (latest 0.8.4) does not ship
# `DecodeConfig::decode_coefficients_with_jbrd_metadata`, which our
# `jpeg-reencoding` feature requires, and 0.8.4's `parallel` feature does not
# compile with default-features off (`fused_parallel_encode.rs` references
# `color::fast_yuv`, gated behind the default-on `yuv` feature it never
# declares). The local sibling (0.9.0, unpublished) has both: the jbrd API and
# fast_yuv de-gated. Path-patch until zenjpeg 0.9.0 is published.
# CAUTION: the `zenjpeg` version req in jxl-encoder/Cargo.toml must track the
# sibling's version, or this patch silently deactivates and cargo falls back
# to broken crates.io 0.8.4 — that mismatch (req 0.8.4 vs sibling 0.9.0) broke
# every nightly-CI run 2026-07-08..13.
# Required for the `jpeg-reencoding` feature to build.
zenjpeg = { git = "https://github.com/imazen/zenjpeg", rev = "fd36fd472ca88526eccf8a78788026e704042ba6" }
# Current 0.4 decoder source, pinned for portable standalone checkouts.
# The zensim-decoder test alias uses this revision; 0.3 compatibility
# requirements still resolve the published older decoder.
zenjxl-decoder = { git = "https://github.com/imazen/zenjxl-decoder", rev = "426f179be58fbf7943e6030164c29b261eb290f1" }
# Pin the approved pre-allocation accounting API while 0.9.4 is unreleased.
# A git revision also prevents unrelated local sibling WIP changing the build.
butteraugli = { git = "https://github.com/imazen/butteraugli", rev = "795aa3727252dc56840501864aefc4a8a537c8ea" }
# W44-phase3-B1: GPU butteraugli backend lives in the zenmetrics workspace
# at `crates/butteraugli-gpu`. `publish = false`, so pinned by Git revision;
# pulled in via the `gpu-butteraugli` cargo feature in `jxl-encoder/Cargo.toml`.
butteraugli-gpu = { git = "https://github.com/imazen/zenmetrics", rev = "0a61830db89a768ab9462f166d1412e948e4efa9" }
# cvvdp-gpu lives in the same zenmetrics workspace. Only used by
# `examples/cvvdp_track_baseline.rs` (RFC `docs/RFC_CVVDP_FORK.md` §5).
# `publish = false` upstream; pinned to the same zenmetrics Git revision here.
cvvdp-gpu = { git = "https://github.com/imazen/zenmetrics", rev = "0a61830db89a768ab9462f166d1412e948e4efa9" }
# CPU CVVDP is a direct Git dependency of the member (package name `cvvdp`,
# dependency name `cvvdp-cpu`). GPU metric crates share one zenmetrics revision.
zensim-gpu = { git = "https://github.com/imazen/zenmetrics", rev = "0a61830db89a768ab9462f166d1412e948e4efa9" }
# zensim 0.3.0 is required transitively by zensim-gpu (its Phase 1
# `score_from_linear_planes_with_warm_ref_diffmap` delegates to the
# 0.3-only CPU pipeline). crates.io still serves 0.2.7 as latest, so
# pin a portable Git revision of the zensim workspace for the
# zensim-loop / zensim-loop-gpu builds. The jxl-encoder CPU backend
# (`zensim-loop` feature) also consumes this — APIs we use
# (`compute_with_ref_and_diffmap_linear_planar`,
# `precompute_reference_linear_planar`) are stable across 0.2.7 → 0.3,
# but pinning to 0.3.x here keeps the dep tree consistent with
# zensim-gpu.
zensim = { git = "https://github.com/imazen/zensim", rev = "0badd3669704549294b855d5ec36cb837f349016" }
zenanalyze = { git = "https://github.com/imazen/zenanalyze", rev = "6bbcacb11313923ded6e5eeebb725878c5736453" }
