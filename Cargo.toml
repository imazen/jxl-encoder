[profile.release]
debug = true

[profile.bench]
debug = true

[profile.test]
opt-level = 3

[profile.dev]
opt-level = 2

[workspace]
members = [
    "jxl-encoder",
    "jxl-encoder-cli",
    "jxl-encoder-macros",
    "jxl-encoder-simd",
    # W44-212: tuning-sweep worker binary. Builds independently with
    # `cargo build -p zenjxl-tuning-runner --release`. Pulled into the
    # workspace member list so `cargo check --workspace` covers it; the
    # binary itself stays opt-in for fleet builds (Dockerfile uses
    # `cargo build -p zenjxl-tuning-runner --release`).
    "zenjxl-tuning-runner",
]
resolver = "2"

[workspace.lints.clippy]
missing_safety_doc = "deny"
undocumented_unsafe_blocks = "deny"
# We port many constants verbatim from libjxl C++ source where they
# are written at double precision. Rust f32 literals get truncated at
# parse time so the runtime value is identical to a "shortened"
# representation, but preserving the source-heritage digit count
# helps audits and parity checks. 145+ such constants in this crate.
excessive_precision = "allow"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.package]
version = "0.3.2"
edition = "2024"
license = "AGPL-3.0-only OR LicenseRef-Imazen-Commercial"
repository = "https://github.com/imazen/jxl-encoder"
homepage = "https://github.com/imazen/jxl-encoder"
authors = ["Lilith River"]
rust-version = "1.89"

# Use imazen/jxl-oxide fork until the fix in commit fd4e2c3 lands upstream.
# The fork carries a patch that lets jxl-oxide accept multi-group VarDCT/patches
# bitstreams whose modular global section is empty — the same bitstreams djxl
# and jxl-rs already accept.
[patch.crates-io]
jxl-oxide = { git = "https://github.com/imazen/jxl-oxide.git", rev = "fd4e2c3" }
jxl-color = { git = "https://github.com/imazen/jxl-oxide.git", rev = "fd4e2c3" }
jxl-image = { git = "https://github.com/imazen/jxl-oxide.git", rev = "fd4e2c3" }
jxl-bitstream = { git = "https://github.com/imazen/jxl-oxide.git", rev = "fd4e2c3" }
jxl-coding = { git = "https://github.com/imazen/jxl-oxide.git", rev = "fd4e2c3" }
jxl-frame = { git = "https://github.com/imazen/jxl-oxide.git", rev = "fd4e2c3" }
jxl-grid = { git = "https://github.com/imazen/jxl-oxide.git", rev = "fd4e2c3" }
jxl-modular = { git = "https://github.com/imazen/jxl-oxide.git", rev = "fd4e2c3" }
jxl-render = { git = "https://github.com/imazen/jxl-oxide.git", rev = "fd4e2c3" }
jxl-vardct = { git = "https://github.com/imazen/jxl-oxide.git", rev = "fd4e2c3" }
jxl-threadpool = { git = "https://github.com/imazen/jxl-oxide.git", rev = "fd4e2c3" }
jxl-jbr = { git = "https://github.com/imazen/jxl-oxide.git", rev = "fd4e2c3" }
jxl-oxide-common = { git = "https://github.com/imazen/jxl-oxide.git", rev = "fd4e2c3" }
# zenjpeg 0.7.1 / 0.8.3 (latest crates.io) calls `magetypes::mf32x8::load_8x8(block)`
# but magetypes 0.9.16+ requires the token-passing signature
# `load_8x8(token, block)`. The local workspace at ~/work/zen/zenjpeg/zenjpeg
# (version 0.8.4 unpublished) carries the fix. Path-patch until published.
# Required for the `jpeg-reencoding` feature to build.
zenjpeg = { path = "../zenjpeg/zenjpeg" }
# Use local butteraugli workspace (not crates.io 0.9.2) so the buttloop +
# Lock-Zenjxl regression-gate consume the latest unpublished fixes. Per user
# direction 2026-05-23: "we should be using the local butteraugli and
# butteraugli-gpu not cratesio".
butteraugli = { path = "../../butteraugli/butteraugli" }
# W44-phase3-B1: GPU butteraugli backend lives in the zenmetrics workspace
# at `crates/butteraugli-gpu`. `publish = false` so always path-pinned;
# pulled in via the `gpu-butteraugli` cargo feature in `jxl-encoder/Cargo.toml`.
butteraugli-gpu = { path = "../zenmetrics/crates/butteraugli-gpu" }
# cubecl is pinned to the lilith/cubecl `pr/pinned-v0.10.0` revision the
# zenmetrics workspace uses (matches the cubecl rev butteraugli-gpu is
# tested against). Required to keep the cubecl version consistent across
# the dep tree when the `gpu-butteraugli` feature is enabled.
cubecl = { git = "https://github.com/lilith/cubecl.git", rev = "de2f98573902efe60717cbfc7f8e4f9d630d723e" }
cubecl-runtime = { git = "https://github.com/lilith/cubecl.git", rev = "de2f98573902efe60717cbfc7f8e4f9d630d723e" }
cubecl-core = { git = "https://github.com/lilith/cubecl.git", rev = "de2f98573902efe60717cbfc7f8e4f9d630d723e" }
cubecl-common = { git = "https://github.com/lilith/cubecl.git", rev = "de2f98573902efe60717cbfc7f8e4f9d630d723e" }
cubecl-ir = { git = "https://github.com/lilith/cubecl.git", rev = "de2f98573902efe60717cbfc7f8e4f9d630d723e" }
cubecl-cuda = { git = "https://github.com/lilith/cubecl.git", rev = "de2f98573902efe60717cbfc7f8e4f9d630d723e" }
cubecl-cpu = { git = "https://github.com/lilith/cubecl.git", rev = "de2f98573902efe60717cbfc7f8e4f9d630d723e" }
