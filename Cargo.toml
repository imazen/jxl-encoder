[profile.release]
debug = true

[profile.bench]
debug = true

[workspace]
members = ["jxl_encoder", "jxl_encoder_cli"]
resolver = "2"

[workspace.lints.clippy]
missing_safety_doc = "deny"
undocumented_unsafe_blocks = "deny"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "BSD-3-Clause"
repository = "https://github.com/libjxl/jxl-encoder-rs"
