[profile.release]
debug = true

[profile.bench]
debug = true

[profile.test]
opt-level = 3

[profile.dev]
opt-level = 2

[workspace]
members = ["jxl-encoder", "jxl-encoder-cli", "jxl-encoder-simd"]
resolver = "2"

[workspace.lints.clippy]
missing_safety_doc = "deny"
undocumented_unsafe_blocks = "deny"
# We port many constants verbatim from libjxl C++ source where they
# are written at double precision. Rust f32 literals get truncated at
# parse time so the runtime value is identical to a "shortened"
# representation, but preserving the source-heritage digit count
# helps audits and parity checks. 145+ such constants in this crate.
excessive_precision = "allow"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.package]
version = "0.3.2"
edition = "2024"
license = "AGPL-3.0-only OR LicenseRef-Imazen-Commercial"
repository = "https://github.com/imazen/jxl-encoder"
homepage = "https://github.com/imazen/jxl-encoder"
authors = ["Lilith River"]
rust-version = "1.89"

# Use imazen/jxl-oxide fork until the fix in commit fd4e2c3 lands upstream.
# The fork carries a patch that lets jxl-oxide accept multi-group VarDCT/patches
# bitstreams whose modular global section is empty — the same bitstreams djxl
# and jxl-rs already accept.
[patch.crates-io]
jxl-oxide = { git = "https://github.com/imazen/jxl-oxide.git", rev = "fd4e2c3" }
jxl-color = { git = "https://github.com/imazen/jxl-oxide.git", rev = "fd4e2c3" }
jxl-image = { git = "https://github.com/imazen/jxl-oxide.git", rev = "fd4e2c3" }
jxl-bitstream = { git = "https://github.com/imazen/jxl-oxide.git", rev = "fd4e2c3" }
jxl-coding = { git = "https://github.com/imazen/jxl-oxide.git", rev = "fd4e2c3" }
jxl-frame = { git = "https://github.com/imazen/jxl-oxide.git", rev = "fd4e2c3" }
jxl-grid = { git = "https://github.com/imazen/jxl-oxide.git", rev = "fd4e2c3" }
jxl-modular = { git = "https://github.com/imazen/jxl-oxide.git", rev = "fd4e2c3" }
jxl-render = { git = "https://github.com/imazen/jxl-oxide.git", rev = "fd4e2c3" }
jxl-vardct = { git = "https://github.com/imazen/jxl-oxide.git", rev = "fd4e2c3" }
jxl-threadpool = { git = "https://github.com/imazen/jxl-oxide.git", rev = "fd4e2c3" }
jxl-jbr = { git = "https://github.com/imazen/jxl-oxide.git", rev = "fd4e2c3" }
jxl-oxide-common = { git = "https://github.com/imazen/jxl-oxide.git", rev = "fd4e2c3" }
