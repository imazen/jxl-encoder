[package]
name = "jxl-encoder-macros"
description = "Proc-macros for jxl-encoder strategy_def! and related declarative gate registries (W44-192)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
keywords = ["jpeg-xl", "macros"]
categories = ["multimedia::images", "development-tools::procedural-macro-helpers"]
include = ["/src/**", "/README.md", "/LICENSE*"]

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0.106"
quote = "1.0.45"
syn = { version = "2.0.117", features = ["full", "extra-traits"] }

[dev-dependencies]
trybuild = "1.0.116"
