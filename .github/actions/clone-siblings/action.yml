name: Clone sibling path-dep repos
description: >
  Clone the sibling repos that the workspace Cargo.toml (and the workspaces it
  path-references, transitively) need on disk. Cargo refuses to even parse the
  workspace manifest unless every path-dep manifest can be loaded — true even
  for --lib builds, `cargo fmt --check`, and `cargo clippy`. Worse, loading any
  member of a sibling WORKSPACE (e.g. zenmetrics/crates/cvvdp) loads that whole
  workspace, so every member of every referenced sibling workspace must also
  resolve its own path deps. The list below is the transitive closure computed
  from the local repo graph (2026-06-09); regenerate with a path-dep walk when
  a sibling gains a new path dependency (the symptom is `cargo metadata` dying
  with "failed to load manifest for workspace member <sibling>/crates/<x>").

  Runs on Linux, macOS, and Windows via bash (Git Bash on Windows). Also writes
  a Cross.toml pre-build hook so builds invoked through `cross` re-clone the
  sibling layout inside the container.

  Direct dependencies of this workspace (parent of the workspace unless noted):
    - imazen/zenjpeg → ../zenjpeg ([patch.crates-io] ../zenjpeg/zenjpeg;
      crates.io zenjpeg predates the magetypes token-passing API we require).
    - imazen/zenjxl-decoder → ../zenjxl-decoder (dev-dep of the JBRD
      round-trip conformance gate).
    - imazen/zenmetrics → ../zenmetrics (multi-metric perceptual backend:
      [patch.crates-io] pins crates/{cvvdp-gpu,butteraugli-gpu,zensim-gpu};
      jxl-encoder member path-deps crates/cvvdp — the #66 failure).
    - imazen/zensim → ../zensim ([patch.crates-io] zensim = ../zensim/zensim).
    - imazen/butteraugli → ../../butteraugli (GRANDPARENT level; pinned at
      ../../butteraugli/butteraugli).

  Transitive (needed only so the sibling WORKSPACES parse):
    - imazen/zenanalyze → ../zenanalyze (zenjpeg + zenavif + zenmetrics)
    - imazen/zencodec → ../zencodec (feature-pulled by zenmetrics/zensim)
    - imazen/zenpng, imazen/zenwebp, imazen/zenavif, imazen/zenjxl
      → ../{zenpng,zenwebp,zenavif,zenjxl} (zenmetrics + zensim workspaces)
    - imazen/ultrahdr → ../ultrahdr (zenmetrics/crates/zenhdr-corpus)
    - imazen/heic → ../heic (zenmetrics/crates/zenhdr-corpus)
    - imazen/zentone → ../zentone (ultrahdr/ultrahdr-core)
    - imazen/fast-ssim2 → ../fast-ssim2 (zenmetrics/crates/zen-metrics-cli)
    - lilith/dssim → ../../dssim (GRANDPARENT level; zenmetrics workspace
      pins ../../dssim/dssim-core)

runs:
  using: composite
  steps:
    - name: Clone siblings (host)
      shell: bash
      run: |
        set -euxo pipefail
        # Layout (relative to GITHUB_WORKSPACE):
        #   parent      = sibling repos referenced as ../X
        #   grandparent = repos referenced as ../../X (butteraugli, dssim)
        parent="$(dirname "$GITHUB_WORKSPACE")"
        grandparent="$(dirname "$parent")"
        clone_if_missing() {
          local url="$1" dst="$2"
          if [ -d "$dst/.git" ]; then
            echo "Already present: $dst"
            return 0
          fi
          git clone --depth 1 "$url" "$dst"
        }
        # Direct path deps of this workspace
        clone_if_missing https://github.com/imazen/zenjpeg       "$parent/zenjpeg"
        clone_if_missing https://github.com/imazen/zenjxl-decoder "$parent/zenjxl-decoder"
        clone_if_missing https://github.com/imazen/zenmetrics    "$parent/zenmetrics"
        clone_if_missing https://github.com/imazen/zensim        "$parent/zensim"
        clone_if_missing https://github.com/imazen/butteraugli   "$grandparent/butteraugli"
        # Transitive: sibling workspaces' own path deps
        clone_if_missing https://github.com/imazen/zenanalyze    "$parent/zenanalyze"
        clone_if_missing https://github.com/imazen/zencodec      "$parent/zencodec"
        clone_if_missing https://github.com/imazen/zenpng        "$parent/zenpng"
        clone_if_missing https://github.com/imazen/zenwebp       "$parent/zenwebp"
        clone_if_missing https://github.com/imazen/zenavif       "$parent/zenavif"
        clone_if_missing https://github.com/imazen/zenjxl        "$parent/zenjxl"
        clone_if_missing https://github.com/imazen/ultrahdr      "$parent/ultrahdr"
        clone_if_missing https://github.com/imazen/heic          "$parent/heic"
        clone_if_missing https://github.com/imazen/zentone       "$parent/zentone"
        clone_if_missing https://github.com/imazen/fast-ssim2    "$parent/fast-ssim2"
        clone_if_missing https://github.com/lilith/dssim         "$grandparent/dssim"

    - name: Append sibling-clone pre-build hook to Cross.toml
      shell: bash
      run: |
        set -euxo pipefail
        # cross-rs runs the build inside a Docker container with the workspace
        # mounted at /project. The host sibling clones live at
        # $GITHUB_WORKSPACE/.. and don't cross the container boundary unless
        # we re-clone inside the container. cross-rs caches the resulting
        # image layer so this only runs on the first build per cross-rs
        # image refresh.
        #
        # The repo already has a checked-in Cross.toml for target metadata;
        # append a [build] pre-build hook that clones the siblings into the
        # paths the workspace Cargo.toml's [patch.crates-io] expects (the
        # workspace is mounted at /project, so `../zenjpeg/zenjpeg` resolves
        # to `/zenjpeg/zenjpeg` and `../../dssim` to `/dssim` — both parent
        # and grandparent levels collapse onto the container root).
        ws="$GITHUB_WORKSPACE"
        cross_toml="$ws/Cross.toml"
        marker="# BEGIN clone-siblings pre-build hook"
        if [ -f "$cross_toml" ] && grep -q "$marker" "$cross_toml"; then
          echo "Pre-build hook already present in $cross_toml; nothing to do"
          exit 0
        fi
        # Use printf (not heredoc) — yaml's mandatory indentation would
        # otherwise be preserved literally by the shell.
        printf '%s\n' '' \
          '# BEGIN clone-siblings pre-build hook' \
          '# Appended by .github/actions/clone-siblings during CI.' \
          '# Clones the sibling repos the workspace (and the sibling' \
          '# workspaces it references) need on disk. Workspace is mounted' \
          '# at /project, so `../X` and `../../X` both resolve under `/`.' \
          '[build]' \
          'pre-build = [' \
          '    "apt-get update && apt-get install -y --no-install-recommends git ca-certificates",' \
          '    "ln -s /project /jxl-encoder",' \
          '    "git clone --depth 1 https://github.com/imazen/zenjpeg /zenjpeg",' \
          '    "git clone --depth 1 https://github.com/imazen/zenjxl-decoder /zenjxl-decoder",' \
          '    "git clone --depth 1 https://github.com/imazen/zenmetrics /zenmetrics",' \
          '    "git clone --depth 1 https://github.com/imazen/zensim /zensim",' \
          '    "git clone --depth 1 https://github.com/imazen/butteraugli /butteraugli",' \
          '    "git clone --depth 1 https://github.com/imazen/zenanalyze /zenanalyze",' \
          '    "git clone --depth 1 https://github.com/imazen/zencodec /zencodec",' \
          '    "git clone --depth 1 https://github.com/imazen/zenpng /zenpng",' \
          '    "git clone --depth 1 https://github.com/imazen/zenwebp /zenwebp",' \
          '    "git clone --depth 1 https://github.com/imazen/zenavif /zenavif",' \
          '    "git clone --depth 1 https://github.com/imazen/zenjxl /zenjxl",' \
          '    "git clone --depth 1 https://github.com/imazen/ultrahdr /ultrahdr",' \
          '    "git clone --depth 1 https://github.com/imazen/heic /heic",' \
          '    "git clone --depth 1 https://github.com/imazen/zentone /zentone",' \
          '    "git clone --depth 1 https://github.com/imazen/fast-ssim2 /fast-ssim2",' \
          '    "git clone --depth 1 https://github.com/lilith/dssim /dssim",' \
          ']' \
          '# END clone-siblings pre-build hook' \
          >> "$cross_toml"
        echo "Appended pre-build hook to $cross_toml"
