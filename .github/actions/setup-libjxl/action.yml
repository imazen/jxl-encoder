name: Set up libjxl reference tools
description: Provide pinned v0.12 cjxl and djxl for reference tests, including cross containers.
runs:
  using: composite
  steps:
    - uses: actions/cache@v6
      id: tools
      with:
        path: .ci-libjxl/tools
        key: libjxl-v0.12.0-${{ runner.os }}-${{ runner.arch }}-cmyk-v1-${{ hashFiles('scripts/libjxl_original_profile.*', 'scripts/cmyk_raw_frame_oracle.cc') }}

    - name: Download static Linux x64 reference tools
      if: steps.tools.outputs.cache-hit != 'true' && runner.os == 'Linux' && runner.arch == 'X64'
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p .ci-libjxl/tools
        sudo apt-get update
        sudo apt-get install -y lzip
        curl --fail --location --retry 3 https://github.com/libjxl/libjxl/releases/download/v0.12.0/jxl-linux-x86_64-static.tar.lz -o .ci-libjxl/linux.tar.lz
        echo '5318a1ea40adad76d023e0c17a03d4627f8282f83cb2b575e69be8e74f1ff456  .ci-libjxl/linux.tar.lz' | sha256sum --check
        tar --lzip -xf .ci-libjxl/linux.tar.lz -C .ci-libjxl/tools

    - name: Download static Windows reference tools
      if: steps.tools.outputs.cache-hit != 'true' && runner.os == 'Windows' && runner.arch == 'X64'
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force .ci-libjxl/tools | Out-Null
        Invoke-WebRequest https://github.com/libjxl/libjxl/releases/download/v0.12.0/jxl-x64-windows-static.zip -OutFile .ci-libjxl/windows.zip
        $digest = (Get-FileHash .ci-libjxl/windows.zip -Algorithm SHA256).Hash.ToLowerInvariant()
        if ($digest -ne '3025d7e308390796d20492322e606bc92decaee7b6bc99d3f7547870ae5db7de') { throw 'libjxl archive checksum mismatch' }
        Expand-Archive .ci-libjxl/windows.zip -DestinationPath .ci-libjxl/tools

    - name: Check out pinned source for native reference oracles
      if: steps.tools.outputs.cache-hit != 'true' && (runner.os == 'macOS' || runner.os == 'Linux' || runner.os == 'Windows')
      uses: actions/checkout@v7
      with:
        repository: libjxl/libjxl
        ref: v0.12.0
        path: .ci-libjxl/source
        submodules: recursive
        persist-credentials: false

    - name: Build native reference tools and public decoder oracles
      if: steps.tools.outputs.cache-hit != 'true' && (runner.os == 'macOS' || runner.os == 'Linux')
      shell: bash
      run: |
        set -euo pipefail
        nice -n 19 cmake -S .ci-libjxl/source -B .ci-libjxl/build \
          -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DBUILD_TESTING=OFF \
          -DJPEGXL_ENABLE_TOOLS=ON -DJPEGXL_ENABLE_BENCHMARK=OFF \
          -DJPEGXL_ENABLE_EXAMPLES=OFF -DJPEGXL_ENABLE_JNI=OFF \
          -DJPEGXL_ENABLE_OPENEXR=OFF -DJPEGXL_ENABLE_SJPEG=OFF \
          -DJPEGXL_ENABLE_DOXYGEN=OFF -DJPEGXL_ENABLE_MANPAGES=OFF \
          -DJPEGXL_BUNDLE_LIBPNG=ON -DJPEGXL_ENABLE_SKCMS=ON \
          -DCMAKE_PROJECT_INCLUDE="$GITHUB_WORKSPACE/scripts/libjxl_original_profile.cmake"
        mkdir -p .ci-libjxl/tools
        if [[ "$RUNNER_OS" != Linux || "$RUNNER_ARCH" != X64 ]]; then
          nice -n 19 cmake --build .ci-libjxl/build --target cjxl djxl --parallel 4
          cp .ci-libjxl/build/tools/cjxl .ci-libjxl/build/tools/djxl .ci-libjxl/tools/
        fi
        nice -n 19 cmake --build .ci-libjxl/build --target jxl-original-profile jxl-cmyk-frames --parallel 4
        cp .ci-libjxl/build/tools/jxl-original-profile .ci-libjxl/build/tools/jxl-cmyk-frames .ci-libjxl/tools/

    - name: Build native reference oracles for Windows
      if: steps.tools.outputs.cache-hit != 'true' && runner.os == 'Windows'
      shell: pwsh
      run: |
        # FindZLIB copies ZLIB_INCLUDE_DIR into the libpng preprocessor's include
        # list. Replace the pinned bundled-build placeholder with both real
        # header directories (zlib.h in source, generated zconf.h in build).
        $cmakeFile = '.ci-libjxl/source/third_party/CMakeLists.txt'
        $cmakeText = [IO.File]::ReadAllText($cmakeFile)
        $needle = 'set(ZLIB_INCLUDE_DIR bing_bong_dir)'
        if ([regex]::Matches($cmakeText, [regex]::Escape($needle)).Count -ne 1) { throw 'Pinned libjxl zlib include binding changed' }
        $replacement = 'set(ZLIB_INCLUDE_DIR "${CMAKE_CURRENT_SOURCE_DIR}/zlib;${CMAKE_CURRENT_BINARY_DIR}/zlib")'
        [IO.File]::WriteAllText($cmakeFile, $cmakeText.Replace($needle, $replacement))
        $cmakeArch = if ($env:RUNNER_ARCH -eq 'ARM64') { 'ARM64' } else { 'x64' }
        cmake -S .ci-libjxl/source -B .ci-libjxl/build -G 'Visual Studio 18 2026' -A $cmakeArch `
          -DBUILD_SHARED_LIBS=OFF -DBUILD_TESTING=OFF `
          -DJPEGXL_ENABLE_TOOLS=ON -DJPEGXL_ENABLE_BENCHMARK=OFF `
          -DJPEGXL_ENABLE_EXAMPLES=OFF -DJPEGXL_ENABLE_JNI=OFF `
          -DJPEGXL_ENABLE_OPENEXR=OFF -DJPEGXL_ENABLE_SJPEG=OFF `
          -DJPEGXL_ENABLE_DOXYGEN=OFF -DJPEGXL_ENABLE_MANPAGES=OFF `
          -DJPEGXL_BUNDLE_LIBPNG=ON -DJPEGXL_ENABLE_SKCMS=ON `
          -DCMAKE_PROJECT_INCLUDE="$env:GITHUB_WORKSPACE/scripts/libjxl_original_profile.cmake"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        $targets = @('jxl-original-profile', 'jxl-cmyk-frames')
        if ($env:RUNNER_ARCH -eq 'ARM64') { $targets += @('cjxl', 'djxl') }
        cmake --build .ci-libjxl/build --config Release --target $targets --parallel 4
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        New-Item -ItemType Directory -Force .ci-libjxl/tools | Out-Null
        Copy-Item .ci-libjxl/build/tools/Release/jxl-original-profile.exe, .ci-libjxl/build/tools/Release/jxl-cmyk-frames.exe .ci-libjxl/tools/
        if ($env:RUNNER_ARCH -eq 'ARM64') {
          Copy-Item .ci-libjxl/build/tools/Release/cjxl.exe, .ci-libjxl/build/tools/Release/djxl.exe .ci-libjxl/tools/
        }

    - name: Verify versions and export reference paths
      shell: bash
      run: |
        set -euo pipefail
        for tool in cjxl djxl; do
          suffix=''
          if [[ "$RUNNER_OS" == Windows ]]; then suffix='.exe'; fi
          matches=()
          while IFS= read -r match; do matches+=("$match"); done < <(find "$PWD/.ci-libjxl/tools" -type f -name "$tool$suffix")
          if [[ ${#matches[@]} != 1 ]]; then echo "Expected one $tool, found ${#matches[@]}" >&2; exit 1; fi
          tool_path="${matches[0]}"
          echo "Verifying $tool at $tool_path"
          if version=$("$tool_path" --version 2>&1); then
            echo "$version"
          else
            status=$?
            echo "$version" >&2
            echo "$tool --version failed with exit status $status" >&2
            exit "$status"
          fi
          if [[ "$version" != *v0.12.* ]]; then echo 'Incorrect libjxl version' >&2; exit 1; fi
          if [[ "$RUNNER_OS" == Windows ]]; then tool_path=$(cygpath -m "$tool_path"); fi
          if [[ "$tool" == cjxl ]]; then key=CJXL_PATH; else key=DJXL_PATH; fi
          echo "$key=$tool_path" >> "$GITHUB_ENV"
        done
        for binding in jxl-original-profile:LIBJXL_ORIGINAL_PROFILE_ORACLE jxl-cmyk-frames:CMYK_RAW_FRAME_ORACLE; do
          oracle="$PWD/.ci-libjxl/tools/${binding%:*}$suffix"
          "$oracle" --version
          if [[ "$RUNNER_OS" == Windows ]]; then oracle=$(cygpath -m "$oracle"); fi
          echo "${binding#*:}=$oracle" >> "$GITHUB_ENV"
        done
        mkdir -p "$HOME/tmp/jxl-encoder-reference-tests"
        scratch_path="$HOME/tmp/jxl-encoder-reference-tests"
        if [[ "$RUNNER_OS" == Windows ]]; then scratch_path=$(cygpath -m "$scratch_path"); fi
        for key in TMPDIR TMP TEMP JXL_CROSS_TEST_TMP; do
          echo "$key=$scratch_path" >> "$GITHUB_ENV"
        done
        echo "JXL_ENCODER_OUTPUT_DIR=$scratch_path/output/jxl-encoder" >> "$GITHUB_ENV"
