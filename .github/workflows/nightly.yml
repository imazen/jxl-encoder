name: Nightly regression gates

# Long-running tests that don't belong in the per-push CI gate but must run
# at least daily so drift is caught within ~24h of landing. Currently:
#
# - **zenjxl_regression_gate** locks the W44-202 baseline (12 cells from a
#   1978-cell paired sweep) as an invariant against any tuning change that
#   silently regresses Zenjxl's bytes/quality/wall-time profile vs cjxl e7.
#   See `jxl-encoder/tests/zenjxl_regression_gate.rs` module doc for the
#   rebaseline procedure when a regression is intentional.

on:
  schedule:
    # 08:30 UTC daily — after typical EU/US working hours so failures don't
    # collide with the per-push CI matrix demand.
    - cron: '30 8 * * *'
  workflow_dispatch:
    # Allow manual triggering from the Actions tab when investigating a
    # suspected regression after a tuning change.

concurrency:
  group: nightly-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CI: true

jobs:
  zenjxl-regression-gate:
    name: Zenjxl regression gate (W44-202 baseline lock)
    runs-on: ubuntu-latest
    # 30 min budget: the 12-cell test runs in ~10s on the 7950X reference;
    # on GitHub-hosted ubuntu-latest (~3-4x slower) expect ~40-60s. The
    # surplus absorbs cache-miss workspace builds.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - name: Clone sibling path-dep repos
        uses: ./.github/actions/clone-siblings

      - name: Sparse-checkout codec corpus (test images only)
        run: |
          set -euxo pipefail
          # The full imazen/codec-corpus repo is ~2.2 GB; we only need the
          # CID22 + gb82-sc PNGs for the 21 locked cells (the imazen-26
          # cells are fetched from R2 in the next step). Sparse-checkout
          # fetches only the paths the tests read.
          mkdir -p "$RUNNER_TEMP/codec-corpus"
          cd "$RUNNER_TEMP/codec-corpus"
          git init -q
          git remote add origin https://github.com/imazen/codec-corpus.git
          git config core.sparseCheckout true
          cat > .git/info/sparse-checkout <<'EOF'
          CID22/CID22-512/validation/1025469.png
          CID22/CID22-512/validation/1044329.png
          CID22/CID22-512/validation/1189261.png
          CID22/CID22-512/validation/1418519.png
          CID22/CID22-512/validation/1420710.png
          CID22/CID22-512/validation/1475938.png
          CID22/CID22-512/validation/1531677.png
          CID22/CID22-512/validation/2389166.png
          CID22/CID22-512/validation/297394.png
          CID22/CID22-512/validation/3637739.png
          CID22/CID22-512/validation/7062219.png
          CID22/CID22-512/validation/1279330.png
          CID22/CID22-512/validation/2079234.png
          CID22/CID22-512/validation/2253934.png
          CID22/CID22-512/validation/2775196.png
          CID22/CID22-512/validation/3156482.png
          CID22/CID22-512/validation/6292444.png
          gb82-sc/codec_wiki.png
          gb82-sc/graph.png
          gb82-sc/imac_g3.png
          gb82-sc/terminal.png
          gb82-sc/windows95.png
          EOF
          git pull --depth=1 origin main
          ls -la CID22/CID22-512/validation/ gb82-sc/

      - name: Fetch imazen-26 gate images (R2, sha256-pinned)
        env:
          CODEC_CORPUS_DIR: ${{ runner.temp }}/codec-corpus
        run: ./scripts/hunt/fetch_imazen26_gate_files.sh

      - name: Set up libjxl v0.12 reference tools
        uses: ./.github/actions/setup-libjxl

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust-nightly

      - name: Run zenjxl regression gate
        env:
          CODEC_CORPUS_DIR: ${{ runner.temp }}/codec-corpus
        run: |
          cargo test --locked \
            --release \
            -p jxl-encoder \
            --features "parallel butteraugli-loop ssim2-loop zenjxl-regression-gate" \
            --test it zenjxl_regression_gate \
            -- --include-ignored --nocapture

      # Corpus-dependent decoder-roundtrip gates. These are #[ignore] in the
      # per-push CI matrix (stock runners have no corpus checkout); the sparse
      # checkout above provides exactly the files they read, so nightly is
      # where they stay exercised in automation. The skip decision lives HERE
      # (the caller), never inside the tests.
      - name: Validate two-pass input canonicalization
        env:
          CODEC_CORPUS_DIR: ${{ runner.temp }}/codec-corpus
        run: cargo test --locked --release -p jxl-encoder --lib --features corpus-tests canonicalization_corpus_roundtrip -- --nocapture

      - name: Validate cancellation and concurrent canonicalization
        env:
          CODEC_CORPUS_DIR: ${{ runner.temp }}/codec-corpus
        run: cargo test --locked --release -p jxl-encoder --features corpus-tests,parallel --test production_resources -- --test-threads=1 --nocapture

      - name: Run corpus decoder-roundtrip gates
        env:
          CODEC_CORPUS_DIR: ${{ runner.temp }}/codec-corpus
        run: |
          python3 -m unittest discover -s scripts -p test_jxl_bitstream_diff.py
          cargo test --locked \
            --release \
            -p jxl-encoder \
            --features "parallel butteraugli-loop" \
            --test it \
            --test env_overrides \
            -- --include-ignored \
            w44_164_decoder_roundtrip w44_166_decoder_roundtrip \
            w44_176_decoder_roundtrip w44_205_decoder_roundtrip \
            w44_78_decoder_roundtrip empty_modular_section_roundtrip

      # RD monotonicity gates (docs/RFC_RD_MONOTONICITY.md). These fail only
      # on NEW violations: the three known, diagnosed ones are allow-listed in
      # benchmarks/rd_monotonicity_known_violations.tsv, so the gate can run in
      # automation instead of being disabled for failing on day one. Removing a
      # line from that file is how a fix gets proven.
      #
      # A hard failure needs BOTH oracles (SSIMULACRA2 and butteraugli) to agree
      # the ordering inverted -- SSIM2 alone jitters near its ceiling and would
      # cry wolf on the highest-quality cells.
      - name: RD distance-monotonicity gate
        env:
          CODEC_CORPUS_DIR: ${{ runner.temp }}/codec-corpus
          CJXL_PATH: ${{ github.workspace }}/.ci-libjxl/tools/cjxl
          DJXL_PATH: ${{ github.workspace }}/.ci-libjxl/tools/djxl
        run: |
          cargo run --locked --release -p jxl-encoder \
            --example rd_monotonicity_gate -- \
            "${CODEC_CORPUS_DIR}" "${RUNNER_TEMP}/rd_monotonicity.tsv" \
            --images 6 --size 512 --efforts 5,8 --baseline /dev/null

      # Effort axis: effort N may not be Pareto-dominated by N-1.
      - name: RD effort-envelope gate
        env:
          CODEC_CORPUS_DIR: ${{ runner.temp }}/codec-corpus
          CJXL_PATH: ${{ github.workspace }}/.ci-libjxl/tools/cjxl
          DJXL_PATH: ${{ github.workspace }}/.ci-libjxl/tools/djxl
        run: |
          cargo run --locked --release -p jxl-encoder \
            --example effort_monotonicity_gate -- \
            "${CODEC_CORPUS_DIR}" "${RUNNER_TEMP}/effort_monotonicity.tsv" \
            --images 4 --size 512 --efforts 3,5,7,9 --distances 1.0,4.0 --reps 1


  encoder-fuzz:
    name: Encoder admission and streaming fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 4
      RAYON_NUM_THREADS: 4
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/clone-siblings
      - uses: dtolnay/rust-toolchain@nightly
      - name: Prepare real-image fuzz corpus
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/tmp/encoder-fuzz/artifacts/request_limits" "$HOME/tmp/encoder-fuzz/artifacts/streaming_roundtrip"
          echo "TMPDIR=$HOME/tmp" >> "$GITHUB_ENV"
          git clone --depth 1 --filter=blob:none --sparse https://github.com/imazen/codec-corpus.git "$HOME/tmp/fuzz-source"
          git -C "$HOME/tmp/fuzz-source" sparse-checkout set --no-cone CID22/CID22-512/validation/1418519.png gb82-sc/codec_wiki.png
          python3 -m venv "$HOME/tmp/fuzz-python"
          "$HOME/tmp/fuzz-python/bin/pip" install Pillow==12.3.0
          printf 'image\tpath\nphoto\t%s/CID22/CID22-512/validation/1418519.png\ncodec_wiki\t%s/gb82-sc/codec_wiki.png\n' "$HOME/tmp/fuzz-source" "$HOME/tmp/fuzz-source" > "$HOME/tmp/fuzz-inputs.tsv"
          "$HOME/tmp/fuzz-python/bin/python" scripts/seed_encoder_fuzz.py "$HOME/tmp/fuzz-inputs.tsv" "$HOME/tmp/encoder-fuzz/corpus" --build-commit "$GITHUB_SHA"
      - name: Install and build sanitizer targets
        run: |
          set -o pipefail
          nice -n 19 cargo install cargo-fuzz --version 0.13.2 --locked 2>&1 | tee "$HOME/tmp/encoder-fuzz/install.log"
          nice -n 19 cargo fuzz build --codegen-units 16 2>&1 | tee "$HOME/tmp/encoder-fuzz/build.log"
      - name: Fuzz request admission
        run: |
          set -o pipefail
          nice -n 19 cargo fuzz run --codegen-units 16 request_limits "$HOME/tmp/encoder-fuzz/corpus/request_limits" -- -artifact_prefix="$HOME/tmp/encoder-fuzz/artifacts/request_limits/" -rss_limit_mb=2048 -max_total_time=120 -timeout=60 -max_len=500000 -print_final_stats=1 2>&1 | tee "$HOME/tmp/encoder-fuzz/request_limits.log"
      - name: Fuzz streaming byte and pixel equivalence
        run: |
          set -o pipefail
          nice -n 19 cargo fuzz run --codegen-units 16 streaming_roundtrip "$HOME/tmp/encoder-fuzz/corpus/streaming_roundtrip" -- -artifact_prefix="$HOME/tmp/encoder-fuzz/artifacts/streaming_roundtrip/" -rss_limit_mb=2048 -max_total_time=300 -timeout=60 -max_len=500000 -print_final_stats=1 2>&1 | tee "$HOME/tmp/encoder-fuzz/streaming_roundtrip.log"
      - name: Preserve fuzz corpus and failures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: encoder-fuzz-${{ github.sha }}
          path: ~/tmp/encoder-fuzz
          if-no-files-found: error
          retention-days: 30
