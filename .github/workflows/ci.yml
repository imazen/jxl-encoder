name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel earlier in-flight runs of this workflow on the same branch
# when a new commit lands. Without this, a rapid push burst stacks
# 10+ full matrices in the runner queue, and the latest commit's CI
# only starts after every prior commit's CI finishes — even though
# only the head matters for "is main green?". Pull-request runs use
# the PR number to keep concurrent reviews from cancelling each
# other's CI.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CI: true

jobs:
  # ==========================================================================
  # Native x64 testing (full features, full test suite)
  # ==========================================================================
  build-x64:
    name: Build x64 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v6

      - name: Clone sibling path-dep repos
        uses: ./.github/actions/clone-siblings

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust

      - name: Build workspace
        run: cargo build --workspace --release

      - name: Run tests
        run: cargo test --workspace --release

      # Belt-and-suspenders: ensure the no_std + alloc path keeps
      # compiling. `jxl-encoder-simd` is `#![no_std]` unconditionally
      # and depends on `libm` for `f32` math (closes #38). Without
      # this CI step a future change reintroducing an inherent
      # `f32::method()` call would silently break wasm / embedded
      # downstream builds.
      - name: Build (no-std, no-default-features)
        if: matrix.os == 'ubuntu-latest'
        run: cargo build -p jxl-encoder --no-default-features

  # ==========================================================================
  # Native ARM64 + macOS Intel testing
  # ==========================================================================
  build-native:
    name: Build native (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04-arm, name: Linux, run_tests: true }
          - { os: macos-latest, name: macOS, run_tests: true }
          # Windows ARM: build-only (fd-lock dev-dep doesn't compile on aarch64-windows)
          - { os: windows-11-arm, name: "Windows ARM", run_tests: false }
          - { os: macos-26-intel, name: "macOS Intel", run_tests: true }

    steps:
      - uses: actions/checkout@v6

      - name: Clone sibling path-dep repos
        uses: ./.github/actions/clone-siblings

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust

      - name: Build workspace
        run: cargo build --workspace --release

      - name: Run tests
        if: matrix.run_tests
        run: cargo test --workspace --release

  # ==========================================================================
  # Cross-compiled testing with QEMU emulation (32-bit targets)
  # ==========================================================================
  build-cross:
    name: Cross (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: i686-unknown-linux-gnu, run_tests: true }
          # armv7: build-only (QEMU emulation is very slow; i686 already validates 32-bit)
          - { target: armv7-unknown-linux-gnueabihf, run_tests: false }

    steps:
      - uses: actions/checkout@v6

      - name: Clone sibling path-dep repos
        uses: ./.github/actions/clone-siblings

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        uses: taiki-e/install-action@cross

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust

      # Cross-compile uses no-default-features to avoid butteraugli's
      # linear-srgb dependency issues on some cross targets.
      # zenjxl-tuning-runner is a Linux-fleet-only sweep binary; its
      # parquet/zstd C deps don't build on the old cross images, so it
      # is excluded here (native jobs still build + test it).
      - name: Build (cross)
        run: cross build --workspace --exclude zenjxl-tuning-runner --release --no-default-features --features "std" --target ${{ matrix.target }}

      - name: Test lib (cross/QEMU)
        if: matrix.run_tests
        run: cross test --workspace --exclude zenjxl-tuning-runner --release --no-default-features --features "std" --lib --target ${{ matrix.target }}

  # ==========================================================================
  # WASM Runtime Tests (wasm32-wasip1 + simd128)
  # ==========================================================================
  test-wasm:
    name: WASM (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: scalar, rustflags: "" }
          - { name: simd128, rustflags: "-C target-feature=+simd128" }

    steps:
      - uses: actions/checkout@v6

      - name: Clone sibling path-dep repos
        uses: ./.github/actions/clone-siblings

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - name: Install wasmtime
        uses: bytecodealliance/actions/wasmtime/setup@v1

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust

      # WASM uses no-default-features: butteraugli and other optional deps
      # don't support wasm32 targets. zenjxl-tuning-runner is excluded:
      # its parquet dependency pulls zstd-sys (C), which has no
      # wasm32-wasip1 build.
      - name: Build for WASM
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: cargo build --workspace --exclude zenjxl-tuning-runner --release --no-default-features --features "std" --target wasm32-wasip1

      - name: Test jxl-encoder-simd (SIMD-vs-scalar tests)
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
          CARGO_TARGET_WASM32_WASIP1_RUNNER: "wasmtime run --dir=."
        run: cargo test -p jxl-encoder-simd --release --target wasm32-wasip1 --lib

  # ==========================================================================
  # Code Coverage
  # ==========================================================================
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6

      - name: Clone sibling path-dep repos
        uses: ./.github/actions/clone-siblings

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust

      - name: Generate coverage
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info --exclude jxl-encoder-simd

      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # ==========================================================================
  # Clippy (x64 + aarch64, default + zensim-loop features)
  # ==========================================================================
  # ==========================================================================
  # Expert-feature tests: the `__expert` / `__internals` gated surface
  # (the `sweep` module's unique-config tests, `internal_params`
  # propagation, the W44-194 divergence-table drift test + Libjxl
  # per-cell byte-lock). These are gated out of the default build, so the
  # other jobs do not cover them.
  # ==========================================================================
  expert-tests:
    name: Expert tests (__expert)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Clone sibling path-dep repos
        uses: ./.github/actions/clone-siblings
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust
      - name: Test (__expert __internals)
        run: cargo test -p jxl-encoder --features "__expert __internals" --release

  clippy:
    name: Clippy (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, name: x64 }
          - { os: ubuntu-24.04-arm, name: aarch64 }

    steps:
      - uses: actions/checkout@v6

      - name: Clone sibling path-dep repos
        uses: ./.github/actions/clone-siblings

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust

      - name: Clippy (default features)
        run: cargo clippy --workspace -- -D warnings

      - name: Clippy (zensim-loop)
        run: cargo clippy --workspace --features zensim-loop -- -D warnings


  # ==========================================================================
  # Format check
  # ==========================================================================
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Clone sibling path-dep repos
        uses: ./.github/actions/clone-siblings

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      # NOT `cargo fmt --all`: --all also formats local path-dependency
      # repos (the cloned siblings), which both fails on their layout
      # quirks and gates our CI on their formatting state. Scope to this
      # workspace's own members.
      - name: Format check
        run: >-
          cargo fmt
          -p jxl-encoder
          -p jxl-encoder-cli
          -p jxl-encoder-macros
          -p jxl-encoder-simd
          -p zenjxl-tuning-runner
          -- --check

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Clone sibling path-dep repos
        uses: ./.github/actions/clone-siblings

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: taiki-e/install-action@cargo-hack

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check MSRV
        run: cargo hack check --rust-version --workspace
