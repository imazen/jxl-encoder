name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CI: true
  # Default features include butteraugli-loop which requires path deps to sibling repos.
  # CI uses --no-default-features with only safe-mode enabled.
  CI_FEATURES: "safe-mode"

jobs:
  # ==========================================================================
  # Native x64 testing
  # ==========================================================================
  build-x64:
    name: Build x64 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build workspace
        run: cargo build --workspace --no-default-features --features "${{ env.CI_FEATURES }}"

      # Note: cargo test requires dev-dependencies (jxl-rs, jxl-oxide, etc.)
      # which use path deps to sibling repos not available in CI.
      # Only lib unit tests (no integration tests) could potentially work.
      - name: Run lib unit tests
        run: cargo test --workspace --no-default-features --features "${{ env.CI_FEATURES }}" --lib

  # ==========================================================================
  # Native ARM64 testing
  # ==========================================================================
  build-aarch64:
    name: Build aarch64 (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04-arm, name: Linux }
          - { os: macos-latest, name: macOS }
          - { os: windows-11-arm, name: "Windows ARM" }

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build workspace
        run: cargo build --workspace --no-default-features --features "${{ env.CI_FEATURES }}"

      - name: Run lib unit tests
        run: cargo test --workspace --no-default-features --features "${{ env.CI_FEATURES }}" --lib

  # ==========================================================================
  # Cross-compiled testing with QEMU emulation (32-bit targets)
  # ==========================================================================
  build-cross:
    name: Cross (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - i686-unknown-linux-gnu
          - armv7-unknown-linux-gnueabihf

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        uses: taiki-e/install-action@cross

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build (cross)
        run: cross build --workspace --no-default-features --features "${{ env.CI_FEATURES }}" --target ${{ matrix.target }}

      - name: Test lib (cross/QEMU)
        run: cross test --workspace --no-default-features --features "${{ env.CI_FEATURES }}" --lib --target ${{ matrix.target }}

  # ==========================================================================
  # WASM Build Check (wasm32 + simd128)
  # ==========================================================================
  test-wasm:
    name: WASM Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build for WASM
        env:
          RUSTFLAGS: "-C target-feature=+simd128"
        run: cargo build -p jxl-encoder --no-default-features --features "${{ env.CI_FEATURES }}" --target wasm32-wasip1

  # ==========================================================================
  # Code Coverage
  # ==========================================================================
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Generate coverage
        run: cargo llvm-cov --workspace --no-default-features --features "${{ env.CI_FEATURES }}" --lib --lcov --output-path lcov.info

      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # ==========================================================================
  # RD Regression (main branch only)
  # ==========================================================================
  rd-regression:
    name: RD Regression
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run RD regression
        run: cargo test -p jxl-encoder --release --no-default-features --features "${{ env.CI_FEATURES }}" --test clic2025 test_rd_regression -- --ignored --nocapture

  # ==========================================================================
  # Clippy
  # ==========================================================================
  clippy:
    name: Clippy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --workspace --no-default-features --features "${{ env.CI_FEATURES }}" -- -D warnings

  # ==========================================================================
  # Format check
  # ==========================================================================
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Format check
        run: cargo fmt --all -- --check
