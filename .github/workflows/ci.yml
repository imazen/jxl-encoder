name: CI

on:
  push:
    branches: [main, libjxl-exact, "feat/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel earlier in-flight runs of this workflow on the same branch
# when a new commit lands. Without this, a rapid push burst stacks
# 10+ full matrices in the runner queue, and the latest commit's CI
# only starts after every prior commit's CI finishes — even though
# only the head matters for "is main green?". Pull-request runs use
# the PR number to keep concurrent reviews from cancelling each
# other's CI.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CI: true

jobs:
  # ==========================================================================
  # Native x64 testing (full features, full test suite)
  # ==========================================================================
  build-x64:
    # Native matrices build both release and optional debug feature closures.
    # Keep debug symbols out of artifacts to fit the hosted runner's disk.
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_RELEASE_DEBUG: "0"
    name: Build x64 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      - name: Clone sibling path-dep repos
        uses: ./.github/actions/clone-siblings

      - name: Set up libjxl v0.12 reference tools
        uses: ./.github/actions/setup-libjxl

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v2-native-no-debug

      - name: Build workspace
        run: cargo build --locked --workspace --release

      - name: Run tests
        run: cargo test --locked --workspace --release

      - name: CMYK source, Black precision and animation contracts
        run: >-
          cargo test --locked --release -p jxl-encoder
          --features __expert,__internals,__pre_quantized,parallel,rate-control,jpeg-reencoding,chroma-subsampling
          --test black_profile_contract --test cmyk_source_contract
          --test cmyk_prepared_contract --test cmyk_animation_layers_contract
          -- --test-threads=1

      - name: CMYK storage with the std Cargo feature disabled
        run: >-
          cargo test --locked --release -p jxl-encoder --no-default-features
          --features __expert,convenience --test cmyk_default_disabled_contract
          -- --test-threads=1

      - name: Check minimal JPEG transcode feature combination
        if: matrix.os == 'ubuntu-latest'
        run: cargo check --locked -p jxl-encoder --no-default-features --features std,jpeg-reencoding

      - name: Test JPEG reconstruction contract
        if: matrix.os == 'ubuntu-latest'
        run: cargo test --locked -p jxl-encoder --features jpeg-reencoding --test it -- jbrd_roundtrip_conformance jbrd_spec_validity

      - name: Subsampled RGB8 geometry, HDR and ICC metadata
        if: matrix.os == 'ubuntu-latest'
        run: >-
          cargo test --locked -p jxl-encoder --features jpeg-reencoding,chroma-subsampling
          --test subsampled_odd_shapes --test subsampled_metadata

      - name: Optional source-to-ICC conversion and raw storage
        if: matrix.os == 'ubuntu-latest'
        run: >-
          cargo test --locked -p jxl-encoder
          --features __expert,jpeg-reencoding,chroma-subsampling
          --test source_color_contract optional_icc:: -- --test-threads=1

      - name: Default-disabled optional ICC feature graph and row conversion
        run: |
          cargo test --locked -p jxl-encoder --no-default-features --features __expert,jpeg-reencoding,chroma-subsampling --test optional_icc_minimal_contract
          cargo test --locked -p jxl-encoder --no-default-features --features __expert,jpeg-reencoding,chroma-subsampling --lib api::cms::

      - name: Test the external loop metric (__external_metric)
        if: matrix.os == 'ubuntu-latest'
        run: cargo test --locked --release -p jxl-encoder --features __external_metric --test it -- external_metric loop_trace

      - name: Verify perceptual metric color domains against both decoders
        if: matrix.os == 'ubuntu-latest'
        run: cargo test --locked --release -p jxl-encoder --features __external_metric --test metric_color_domain

      - name: Provision legacy JPEG reconstruction fixtures
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          sudo apt-get install -y libjpeg-turbo-progs
          mkdir -p "$HOME/tmp/jpeg-legacy"
          export JXL_ENCODER_OUTPUT_DIR="$HOME/tmp/jpeg-legacy/encoder"
          cargo run --locked -p jxl-encoder --features jpeg-reencoding --example jpeg_fixture_setup -- "$HOME/tmp/jpeg-legacy/corpus-root"
          echo "JXL_ENCODER_OUTPUT_DIR=$JXL_ENCODER_OUTPUT_DIR" >> "$GITHUB_ENV"
          echo "CODEC_CORPUS_DIR=$(cat "$HOME/tmp/jpeg-legacy/corpus-root")" >> "$GITHUB_ENV"

      - name: JPEG reconstruction, orientation, subsampling and restart markers
        if: matrix.os == 'ubuntu-latest'
        run: >-
          cargo test --locked -p jxl-encoder --features jpeg-reencoding --test it jpeg_reencoding:: -- --test-threads=1

      - name: JPEG gain-map metadata, pixels and reconstruction
        if: matrix.os == 'ubuntu-latest'
        run: >-
          cargo test --locked -p jxl-encoder --features jpeg-reencoding --test it jpeg_gainmap::

      - name: Subsampled native orientation and conflicting metadata
        if: matrix.os == 'ubuntu-latest'
        run: >-
          cargo test --locked -p jxl-encoder --features jpeg-reencoding,chroma-subsampling
          --test native_orientation subsampled_

      - name: JPEG orientation metadata and exact reconstruction
        if: matrix.os == 'ubuntu-latest'
        run: cargo test --locked -p jxl-encoder --features jpeg-reencoding --test native_orientation jpeg_exif_xmp_combinations_preserve_original_bytes -- --exact

      - name: Gain-map primary and secondary orientation combinations
        if: matrix.os == 'ubuntu-latest'
        run: cargo test --locked -p jxl-encoder --features jpeg-reencoding --test it jpeg_gainmap::iso_gain_map_follows

      - name: JPEG CfL reference pixels at color tile boundaries
        if: matrix.os == 'ubuntu-latest'
        run: >-
          cargo test --locked -p jxl-encoder --features jpeg-reencoding --test it jpeg_cfl_reference::

      # Belt-and-suspenders: ensure the no_std + alloc path keeps
      # compiling. `jxl-encoder-simd` is `#![no_std]` unconditionally
      # and depends on `libm` for `f32` math (closes #38). Without
      # this CI step a future change reintroducing an inherent
      # `f32::method()` call would silently break wasm / embedded
      # downstream builds.
      - name: Build (no-std, no-default-features)
        if: matrix.os == 'ubuntu-latest'
        run: cargo build --locked -p jxl-encoder --no-default-features

  # ==========================================================================
  # Native ARM64 testing (macOS Intel disabled by owner on 2026-09-08).
  # ==========================================================================
  build-native:
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_RELEASE_DEBUG: "0"
    name: Build native (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04-arm, name: Linux, run_tests: true }
          - { os: macos-latest, name: macOS, run_tests: true }
          - { os: windows-11-arm, name: "Windows ARM", run_tests: true }

    steps:
      - uses: actions/checkout@v7

      - name: Clone sibling path-dep repos
        uses: ./.github/actions/clone-siblings

      - name: Set up libjxl v0.12 reference tools
        uses: ./.github/actions/setup-libjxl

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v2-native-no-debug

      - name: Build workspace
        run: cargo build --locked --workspace --release

      - name: Run tests
        if: matrix.run_tests
        run: cargo test --locked --workspace --release

      - name: CMYK source, Black precision and animation contracts
        run: >-
          cargo test --locked --release -p jxl-encoder
          --features __expert,__internals,__pre_quantized,parallel,rate-control,jpeg-reencoding,chroma-subsampling
          --test black_profile_contract --test cmyk_source_contract
          --test cmyk_prepared_contract --test cmyk_animation_layers_contract
          -- --test-threads=1

      - name: CMYK storage with the std Cargo feature disabled
        run: >-
          cargo test --locked --release -p jxl-encoder --no-default-features
          --features __expert,convenience --test cmyk_default_disabled_contract
          -- --test-threads=1

      - name: Optional ICC row conversion and default-disabled feature graph
        run: |
          cargo test --locked --release -p jxl-encoder --no-default-features --features __expert,jpeg-reencoding,chroma-subsampling --lib api::cms::
          cargo test --locked --release -p jxl-encoder --no-default-features --features __expert,jpeg-reencoding,chroma-subsampling --test optional_icc_minimal_contract

      - name: Optional ICC native source and original-profile samples
        if: matrix.name == 'Linux'
        run: >-
          cargo test --locked --release -p jxl-encoder
          --features __expert,jpeg-reencoding,chroma-subsampling
          --test source_color_contract optional_icc:: -- --test-threads=1

      - name: Verify orientation in the original ICC color space
        if: matrix.name == 'Linux'
        run: cargo test --locked --release -p jxl-encoder --features corpus-tests --test native_orientation original_icc_orientation_control -- --exact

      - name: Verify source-white animation in original parametric color space
        if: matrix.name == 'Linux'
        run: >-
          cargo test --locked --release -p jxl-encoder
          --features __expert,parallel,corpus-tests
          --test source_color_contract -- source_white_animation color_admission_xyz_animation color_admission_gamma_white_animation color_admission_animation_width --test-threads=1

      - name: Verify explicit blends in original source profiles
        if: matrix.name == 'Linux'
        run: >-
          cargo test --locked --release -p jxl-encoder
          --features __expert,parallel,corpus-tests
          --test frame_header_contract accepted_blend_layouts -- --test-threads=1

      - name: Verify blends in the original ICC profile
        if: matrix.name == 'Linux'
        run: >-
          cargo test --locked --release -p jxl-encoder
          --features __expert,parallel,corpus-tests
          --test frame_header_contract original_icc_addition -- --test-threads=1

  # ==========================================================================
  # Cross-compiled testing with QEMU emulation (32-bit targets)
  # ==========================================================================
  build-cross:
    name: Cross (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: i686-unknown-linux-gnu, run_tests: true }
          # armv7: build-only (QEMU emulation is very slow; i686 already validates 32-bit)
          - { target: armv7-unknown-linux-gnueabihf, run_tests: false }

    steps:
      - uses: actions/checkout@v7

      - name: Clone sibling path-dep repos
        uses: ./.github/actions/clone-siblings

      - name: Set up libjxl v0.12 reference tools
        if: matrix.run_tests
        uses: ./.github/actions/setup-libjxl

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        uses: taiki-e/install-action@cross

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust

      # Cross-compile uses no-default-features to avoid butteraugli's
      # linear-srgb dependency issues on some cross targets.
      # zenjxl-tuning-runner is a Linux-fleet-only sweep binary; its
      # parquet/zstd C deps don't build on the old cross images, so it
      # is excluded here (native jobs still build + test it).
      - name: Build (cross)
        run: cross build --locked --workspace --exclude zenjxl-tuning-runner --release --no-default-features --features "std" --target ${{ matrix.target }}

      # The runner's default seccomp policy refuses i686 subprocess spawning
      # with ENOSYS; paired same-image controls isolate that policy. Keep the
      # setting on these execution steps, including every decoder assertion.
      - name: Verify i686 reference subprocess execution
        if: matrix.run_tests
        env:
          CROSS_CONTAINER_OPTS: --security-opt seccomp=unconfined
        run: cross test --locked --manifest-path tools/reference-exec-probe/Cargo.toml --release --target ${{ matrix.target }}

      - name: Test lib (cross/i686)
        if: matrix.run_tests
        env:
          CROSS_CONTAINER_OPTS: --security-opt seccomp=unconfined
        run: cross test --locked --workspace --exclude zenjxl-tuning-runner --release --no-default-features --features "std" --lib --target ${{ matrix.target }}

      - name: Optional ICC rows and default-disabled feature graph (cross/i686)
        if: matrix.run_tests
        env:
          CROSS_CONTAINER_OPTS: --security-opt seccomp=unconfined
        run: |
          cross test --locked -p jxl-encoder --release --no-default-features --features __expert,jpeg-reencoding,chroma-subsampling --lib api::cms:: --target ${{ matrix.target }}
          cross test --locked -p jxl-encoder --release --no-default-features --features __expert,jpeg-reencoding,chroma-subsampling --test optional_icc_minimal_contract --target ${{ matrix.target }}

  # ==========================================================================
  # WASM Runtime Tests (wasm32-wasip1 + simd128)
  # ==========================================================================
  test-wasm:
    name: WASM (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: scalar, rustflags: "" }
          - { name: simd128, rustflags: "-C target-feature=+simd128" }

    steps:
      - uses: actions/checkout@v7

      - name: Clone sibling path-dep repos
        uses: ./.github/actions/clone-siblings

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1, wasm32-unknown-unknown

      - name: Install wasmtime
        uses: bytecodealliance/actions/wasmtime/setup@v1

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust

      # WASM uses no-default-features: butteraugli and other optional deps
      # don't support wasm32 targets. zenjxl-tuning-runner is excluded:
      # its parquet dependency pulls zstd-sys (C), which has no
      # wasm32-wasip1 build.
      - name: Build for WASM
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: cargo build --locked --workspace --exclude zenjxl-tuning-runner --release --no-default-features --features "std" --target wasm32-wasip1

      # Browsers run wasm32-unknown-unknown, where std has no clock: the
      # encoder's timers go through crate::clock (a stand-in there), and this
      # build keeps that stand-in in step with how the encoder uses it.
      - name: Build for the browser target
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: cargo build --locked -p jxl-encoder --release --no-default-features --features "std" --target wasm32-unknown-unknown

      - name: Test jxl-encoder-simd (SIMD-vs-scalar tests)
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
          CARGO_TARGET_WASM32_WASIP1_RUNNER: "wasmtime run --dir=."
        run: cargo test --locked -p jxl-encoder-simd --release --target wasm32-wasip1 --lib

  # ==========================================================================
  # Code Coverage
  # ==========================================================================
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Clone sibling path-dep repos
        uses: ./.github/actions/clone-siblings

      - name: Set up libjxl v0.12 reference tools
        uses: ./.github/actions/setup-libjxl

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust

      - name: Generate coverage
        run: cargo llvm-cov --locked --workspace --lcov --output-path lcov.info --exclude jxl-encoder-simd

      - name: Upload to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # ==========================================================================
  # Clippy (x64 + aarch64, default + zensim-loop features)
  # ==========================================================================
  # ==========================================================================
  # Expert-feature tests: the `__expert` / `__internals` gated surface
  # (the `sweep` module's unique-config tests, `internal_params`
  # propagation, the W44-194 divergence-table drift test + Libjxl
  # per-cell byte-lock). These are gated out of the default build, so the
  # other jobs do not cover them.
  # ==========================================================================
  expert-tests:
    name: Expert tests (__expert)
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_RELEASE_DEBUG: "0"
    steps:
      - uses: actions/checkout@v7
      - name: Clone sibling path-dep repos
        uses: ./.github/actions/clone-siblings

      - name: Set up libjxl v0.12 reference tools
        uses: ./.github/actions/setup-libjxl
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust
      - name: Test (__expert __internals)
        run: cargo test --locked -p jxl-encoder --features "__expert __internals" --release --lib --test it
      - name: Test issue 144 production contracts
        env:
          JXL_ENCODER_OUTPUT_DIR: ${{ runner.temp }}/issue144-contracts
        run: >-
          cargo test --locked -p jxl-encoder --release
          --features "__expert,__internals,jpeg-reencoding,parallel,parallel-tree-learning"
          --test frame_header_contract --test color_profile_contract --test icc_tag_contract
          --test request_cancellation --test shifted_extra_edges
          --test squeeze_reference --test squeeze_f32_routes --test squeeze_contract
          --test squeeze_count_matrix --test squeeze_layouts --test squeeze_lf_count
          --test squeeze_group_geometry --test alpha_squeeze_contract
          --test alpha_squeeze_matrix --test alpha_squeeze_progressive
          --test progressive_ac_contract --test progressive_dispatch --test source_color_contract
          --test extra_metadata_contract --test animation_level_contract
          --test animation_resampling_contract --test animation_clock_contract
          --test animation_crop_reference_contract --test animation_delta_candidate_contract
          --test animation_zero_area_contract --test frame_level_delta_contract
          --test modular_width_level_contract --test animation_contract
          --test jpeg_sampling_contract
          -- --test-threads=1
      - name: Selected delta palette contracts
        env:
          JXL_ENCODER_OUTPUT_DIR: ${{ runner.temp }}/issue144-contracts
        run: >-
          cargo test --locked -p jxl-encoder --release
          --features "__expert,parallel,parallel-tree-learning" --lib
          -- delta_palette_contract --include-ignored --test-threads=1
      - name: Delta palette CLI callers
        env:
          JXL_ENCODER_OUTPUT_DIR: ${{ runner.temp }}/issue144-contracts
        run: cargo test --locked -p jxl-encoder-cli --release --test delta_palette -- --test-threads=1
      - name: Test JPEG reconstruction CLI routes
        env:
          JXL_ENCODER_OUTPUT_DIR: ${{ runner.temp }}/issue144-contracts
        run: cargo test --locked -p jxl-encoder-cli --release --features jpeg-reencoding --test jpeg_sampling -- --test-threads=1
      - name: Test optional subsampling resampling admission
        env:
          JXL_ENCODER_OUTPUT_DIR: ${{ runner.temp }}/issue144-contracts
        run: >-
          cargo test --locked -p jxl-encoder --release
          --features "__expert,parallel,jpeg-reencoding,chroma-subsampling"
          --test animation_level_contract optional_subsampling_refuses -- --test-threads=1
      - name: Check progressive alpha wire controls
        run: >-
          python3 scripts/check_progressive_alpha_headers.py
          "${{ runner.temp }}/issue144-contracts/alpha-squeeze-progressive/run-0"
          "${{ runner.temp }}/issue144-contracts/progressive-alpha-headers.json"
      - name: Test precomputed squeezed alpha callers
        env:
          JXL_ENCODER_OUTPUT_DIR: ${{ runner.temp }}/issue144-contracts
        run: >-
          cargo test --locked -p jxl-encoder --release
          --features "__expert,__internals,__pre_quantized,parallel"
          --test alpha_squeeze_matrix precomputed_and -- --test-threads=1
      - name: Test progressive AC prepared callers
        env:
          JXL_ENCODER_OUTPUT_DIR: ${{ runner.temp }}/issue144-contracts
        run: >-
          cargo test --locked -p jxl-encoder --release
          --features "__expert,__internals,__pre_quantized,parallel"
          --test progressive_ac_contract progressive_prepared -- --test-threads=1
      - name: Test extra metadata prepared entries
        env:
          JXL_ENCODER_OUTPUT_DIR: ${{ runner.temp }}/issue144-contracts
        run: >-
          cargo test --locked -p jxl-encoder --release
          --features "__expert,__internals,__pre_quantized,parallel"
          --test extra_metadata_contract extra_metadata_prepared -- --test-threads=1
      - name: Test progressive AC rate-control callers
        env:
          JXL_ENCODER_OUTPUT_DIR: ${{ runner.temp }}/issue144-contracts
        run: |
          cargo test --locked -p jxl-encoder --release --features "__expert,__pre_quantized,parallel,rate-control" --test progressive_ac_contract progressive_rate_control -- --test-threads=1
          cargo test --locked -p jxl-encoder-cli --release --features rate-control --test progressive_ac cli_progressive_rate_control -- --test-threads=1
      - name: Test source-white prepared and rate-control callers
        run: |
          cargo test --locked --release -p jxl-encoder --features __expert,__internals,__pre_quantized,parallel,rate-control --test source_color_contract source_white_prepared -- --test-threads=1
          cargo test --locked --release -p jxl-encoder --features __expert,__internals,__pre_quantized,parallel,rate-control --test source_color_contract color_admission_prepared -- --test-threads=1
          cargo test --locked --release -p jxl-encoder --features __expert,parallel,rate-control --lib rate_control_color_ -- --test-threads=1
      - name: Test source-white metric callback domain
        run: >-
          cargo test --locked --release -p jxl-encoder
          --features __expert,__external_metric,parallel
          --test source_color_contract source_white_metric -- --test-threads=1
      - name: Retain failed issue 144 streams and diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: issue144-contracts
          path: ${{ runner.temp }}/issue144-contracts
          if-no-files-found: warn
      - name: Test lossless oracle artifact roundtrips
        run: cargo test --locked -p jxl-encoder --features "__expert,parallel,learned-admission" --release --example lossless_pareto_calibrate

  clippy:
    name: Clippy (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, name: x64 }
          - { os: ubuntu-24.04-arm, name: aarch64 }

    steps:
      - uses: actions/checkout@v7

      - name: Clone sibling path-dep repos
        uses: ./.github/actions/clone-siblings

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust

      - name: Clippy (default features)
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Check optional rate-control CLI
        run: cargo check --locked -p jxl-encoder-cli --features rate-control --all-targets

      - name: Clippy (zensim-loop)
        run: cargo clippy --locked --workspace --all-targets --features zensim-loop -- -D warnings

      - name: Zensim attribution and candidate binding
        run: cargo test --locked -p jxl-encoder --features zensim-loop,parallel --test zensim_attr_smoke --test zensim_h_arms_smoke

      # `__expert` is not in either clippy lane above, and that is why the 19
      # examples importing `jxl_encoder::effort::{EntropyMulTable,
      # LossyInternalParams}` sat broken (E0603 — `effort` is `pub(crate)`)
      # without CI noticing: every one of them is `__expert`-gated in
      # Cargo.toml, so no default-feature job ever built them.
      #
      # This is `check`, NOT `clippy`, deliberately. The `__expert` example set
      # carries substantial pre-existing lint debt (78 examples, 56 of them
      # `undocumented_unsafe_blocks` around edition-2024 `set_var`), so a
      # `-D warnings` lane here would be red on arrival and would have to be
      # earned file by file. `check` is green today and catches the
      # compile-breakage class that actually rotted.
      - name: Check (__expert examples compile)
        run: cargo check --locked -p jxl-encoder --features "__expert,parallel,butteraugli-loop,ssim2-loop" --examples


  # ==========================================================================
  # Format check
  # ==========================================================================
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Clone sibling path-dep repos
        uses: ./.github/actions/clone-siblings

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      # NOT `cargo fmt --all`: --all also formats local path-dependency
      # repos (the cloned siblings), which both fails on their layout
      # quirks and gates our CI on their formatting state. Scope to this
      # workspace's own members.
      - name: Format check
        run: >-
          cargo fmt
          -p jxl-encoder
          -p jxl-encoder-cli
          -p jxl-encoder-macros
          -p jxl-encoder-simd
          -p zenjxl-tuning-runner
          -- --check

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Clone sibling path-dep repos
        uses: ./.github/actions/clone-siblings

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: taiki-e/install-action@cargo-hack

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check MSRV
        run: cargo hack check --locked --rust-version --workspace
