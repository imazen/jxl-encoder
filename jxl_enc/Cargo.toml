[package]
name = "jxl_enc"
description = "JPEG XL encoder in pure Rust"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["jpeg-xl", "encoder", "image"]
categories = ["multimedia::images", "multimedia::encoding"]

[dependencies]
jxl_enc_transforms = { path = "../jxl_enc_transforms", version = "0.1.0" }
thiserror = "2.0"
byteorder = "1.4"
num-derive = "0.4"
num-traits = "0.2"
# Optional dependencies for rate control feature
jxl-oxide = { path = "../../jxl-efforts/jxl-oxide/crates/jxl-oxide", optional = true }
butteraugli = { path = "../../butteraugli/butteraugli", optional = true }
imgref = { version = "1.10", optional = true }
rgb = { version = "0.8", optional = true }

[features]
trace-bitstream = []
# Verbose debug output for token encoding (DC, AC, entropy codes)
debug-tokens = []
# Debug DC extraction for DCT16x16/32x32
debug-dc = []
# Print AC strategy selection histogram
debug-ac-strategy = []
# Safe mode prevents encoding images > 256x256 (multi-group VarDCT is broken)
# Enabled by default to prevent garbage output. Disable with --no-default-features
# to allow multi-group encoding for debugging/development.
safe-mode = []
# Iterative rate control for improved distance targeting.
# Requires jxl-oxide for decoding and butteraugli for quality measurement.
rate-control = ["dep:jxl-oxide", "dep:butteraugli", "dep:imgref", "dep:rgb"]
# Butteraugli quantization loop: iteratively refines quant field using butteraugli distmap.
butteraugli-loop = ["dep:butteraugli", "dep:imgref", "dep:rgb"]
default = ["safe-mode", "butteraugli-loop"]

[dev-dependencies]
rand = "0.9"
rand_xorshift = "0.4"
image = "0.25"
# jxl-rs (github.com/lilith/jxl-rs) is the PRIMARY decoder for roundtrip tests - do not omit!
jxl = { path = "../../jxl-rs/jxl" }
jxl_transforms = { path = "../../jxl-rs/jxl_transforms" }
# jxl-oxide is secondary - always test jxl-rs first
jxl-oxide = { path = "../../jxl-efforts/jxl-oxide/crates/jxl-oxide" }
# SSIMULACRA2 for perceptual quality metrics (package is "fast-ssim2")
fast-ssim2 = { path = "../../fast-ssim2/ssimulacra2", features = ["imgref"] }
yuvxyb = "0.4.1"
# Butteraugli perceptual quality metric
butteraugli = { path = "../../butteraugli/butteraugli" }
imgref = "1.10"
rgb = "0.8"
walkdir = "2.5"

[lints]
workspace = true
