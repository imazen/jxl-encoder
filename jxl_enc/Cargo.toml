[package]
name = "jxl_enc"
description = "JPEG XL encoder in pure Rust"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["jpeg-xl", "encoder", "image"]
categories = ["multimedia::images", "multimedia::encoding"]

[dependencies]
jxl_enc_transforms = { path = "../jxl_enc_transforms", version = "0.1.0" }
thiserror = "2.0"
byteorder = "1.4"
num-derive = "0.4"
num-traits = "0.2"

[dev-dependencies]
rand = "0.9"
rand_xorshift = "0.4"
image = "0.25"

[lints]
workspace = true
