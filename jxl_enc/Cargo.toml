[package]
name = "jxl_enc"
description = "JPEG XL encoder in pure Rust"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["jpeg-xl", "encoder", "image"]
categories = ["multimedia::images", "multimedia::encoding"]

[dependencies]
jxl_enc_transforms = { path = "../jxl_enc_transforms", version = "0.1.0" }
thiserror = "2.0"
byteorder = "1.4"
num-derive = "0.4"
num-traits = "0.2"

[features]
trace-bitstream = []

[dev-dependencies]
rand = "0.9"
rand_xorshift = "0.4"
image = "0.25"
# jxl-rs (github.com/lilith/jxl-rs) is the PRIMARY decoder for roundtrip tests - do not omit!
jxl = { path = "../../jxl-rs/jxl" }
jxl_transforms = { path = "../../jxl-rs/jxl_transforms" }
# jxl-oxide is secondary - always test jxl-rs first
jxl-oxide = { path = "../../jxl-efforts/jxl-oxide/crates/jxl-oxide" }
# SSIMULACRA2 for perceptual quality metrics
ssimulacra2 = { path = "../../ssimulacra2/ssimulacra2" }
yuvxyb = "0.4.1"

[lints]
workspace = true
