[package]
name = "jxl-encoder-simd"
description = "SIMD-accelerated primitives for jxl-encoder"
readme = "README.md"
documentation = "https://docs.rs/jxl-encoder-simd"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
keywords = ["jpeg-xl", "simd", "dct"]
categories = ["multimedia::images", "algorithms"]
include = ["/src/**", "/README.md", "/LICENSE*"]

[features]
default = ["std"]
std = ["archmage/std", "magetypes/std"]

[dependencies]
archmage = { version = "0.9.15", default-features = false, features = ["macros"] }
magetypes = { version = "0.9.15", default-features = false }
# Pure-Rust libm. Required because the crate is `#![no_std]` and the
# scalar fallback paths use `f32::floor` / `sqrt` / `mul_add` /
# `round` / `round_ties_even`, which are inherent methods only
# available under `std`. Always pulled in (closes #38) — adds ~160 KB
# of source but compiles to a tiny call-through veneer that LLVM
# inlines at use sites, so std builds pay near-zero cost.
libm = { version = "0.2.16", default-features = false }

[lints]
workspace = true
