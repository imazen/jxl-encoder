[package]
name = "jxl-encoder-simd"
description = "SIMD-accelerated primitives for jxl-encoder"
readme = "README.md"
documentation = "https://docs.rs/jxl-encoder-simd"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
keywords = ["jpeg-xl", "simd", "dct"]
categories = ["multimedia::images", "algorithms"]
include = ["/src/**", "/README.md", "/LICENSE*"]

[features]
default = ["std"]
std = ["archmage/std", "magetypes/std"]
# Opt-in AVX-512 tier for magetypes-consolidated kernels (W43-2 onwards).
# When set, `#[magetypes(v4, ...)]` generates an `_v4` variant using native
# `__m512` ops in addition to the AVX2 `_v3` path. Forwarded to magetypes and
# archmage so they enable their internal v4/v4x token machinery.
avx512 = ["magetypes/avx512", "archmage/avx512"]

[dependencies]
# 0.9.27 minimum: magetypes 0.9.27 fully retired the legacy concrete
# per-platform SIMD structs (arm::w128/wasm::w128/x86::w128/w256/w512) in
# favor of the generic strategy-pattern `generic::TYPE<Token>` everywhere,
# including the bare `simd::f32x4` alias on aarch64/wasm32. Our NEON/WASM128
# call sites use the generic `from_repr`/`into_repr` API (see dct8.rs,
# transpose.rs), which only exists uniformly from 0.9.27 onward — pinning
# below it risks resolving to a version whose bare aarch64/wasm32 f32x4 is
# still the old concrete struct lacking those methods.
archmage = { version = "0.9.27", default-features = false, features = ["macros"] }
magetypes = { version = "0.9.27", default-features = false }
# Pure-Rust libm fallback. Only pulled in when `std` is OFF — the
# `scalarmath` veneer in `lib.rs` cfg-gates each `f32` math call so
# `std` builds use the inherent methods (which lower to hardware
# intrinsics like FMA / SSE rounding) and `no_std` builds fall back
# to libm's software implementations. Closes #38.
libm = { version = "0.2.16", default-features = false }

[lints]
workspace = true

[[bench]]
name = "kernel_tiers"
harness = false

[dev-dependencies]
# Workspace-standard benchmarking harness (interleaved arms, paired statistics).
zenbench = "0.1.8"
